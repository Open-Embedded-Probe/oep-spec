profiles:
  host:
    fqbn: lang-ship:host:host
    port: socket://localhost
    platforms:
      - platform: lang-ship:host (1.7.1)
        platform_index_url: https://tanakamasayuki.github.io/lang-ship-arduino-core/package_lang-ship_index.json
    libraries:
      - dir: ../../experiments/uart-binding

  uno:
    fqbn: arduino:avr:uno
    platforms:
      - platform: arduino:avr (1.8.8)
        platform_index_url: https://downloads.arduino.cc/packages/package_index.json
    libraries:
      - dir: ../../experiments/uart-binding

default_profile: host
