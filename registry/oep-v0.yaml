# OEP core wire model v0 registry (working draft, 2026-09-22).
# Single source for every number that appears on the wire. tools/oepgen.py
# generates the C library, the Python module and the test vectors from it.
# Layout rules: little endian; a `bytes` field is variable length and must be
# last; an `array` field is a u8 count followed by repeated structs and must
# be last. Field types: u8 u16 u32 u64 bytes[n] bytes array.
protocol:
  name: oep
  version: 0
  revision: 0

constants:
  confirm_request_magic: "OEP?"
  confirm_result_magic: "OEP!"

roles:
  request: 0x01
  result: 0x02
  activity_update: 0x03
  activity_outcome: 0x04
  notification: 0x05
  data: 0x06

resolutions:
  rejected: 0x00
  completed: 0x01
  accepted: 0x02

outcomes:
  success: 0x00
  failed: 0x01
  partial: 0x02

reject_reasons:
  unknown_function: 0x01
  unknown_operation: 0x02
  malformed_payload: 0x03
  unavailable: 0x04
  busy: 0x05
  window_exceeded: 0x06

# Role headers. Every message starts with the 1-byte role.
headers:
  request: [{name: correlation, type: u16}, {name: function, type: u16}, {name: operation, type: u8}]
  result: [{name: correlation, type: u16}, {name: resolution, type: u8}, {name: detail, type: u8}]
  activity_update: [{name: activity, type: u16}, {name: kind, type: u8}]
  activity_outcome: [{name: activity, type: u16}, {name: outcome, type: u8}]
  notification: [{name: function, type: u16}, {name: kind, type: u8}]
  data: [{name: activity, type: u16}, {name: kind, type: u8}, {name: sequence, type: u16}]

# Owners: 0x0000 = OEP standard definitions. Vendor (probe-specific) tools use
# their own owner id; they may be offered next to the rounded standard tool.
owners:
  oep: 0x0000
  oep_probe_arduino: 0x0100   # ESP32 tools of the oep-probe-arduino project

# TLV: tag(u8) len(u8) value. Bit 7 of the tag marks critical.
tlv:
  critical_mask: 0x80
  core_tags:
    channel_candidate: 0x01     # u16 channel id, repeated
    max_clock_hz: 0x02          # u32
    max_length: 0x03            # u16
    exclusive_group: 0x04       # u16 group id, repeated
    min_clock_hz: 0x05          # u32: smallest rate the instance can be configured for (capture sample rate, 2026-09-22)
    role_assignment: 0x90       # critical: u16 function, u8 role, u16 channel
    start_together: 0x91        # critical: u16 function, repeated

structs:
  offered_function:
    - {name: function, type: u16}
    - {name: owner, type: u16}
    - {name: id, type: u16}
    - {name: revision, type: u8}
    - {name: flags, type: u8}

definitions:
  - name: core
    owner: 0x0000
    id: 0x0000
    revision: 0
    function: 0x0000           # fixed offered-function reference for the endpoint itself
    operations:
      - name: confirm
        op: 0x01
        request: [{name: magic, type: "bytes[4]"}, {name: min_revision, type: u8}, {name: max_revision, type: u8}]
        result: [{name: magic, type: "bytes[4]"}, {name: revision, type: u8}, {name: max_frame, type: u16},
                 {name: window_bytes, type: u16}, {name: max_inflight, type: u8}, {name: flags, type: u8}]
      - name: list
        op: 0x02
        request: [{name: first, type: u8}]
        result: [{name: total, type: u8}, {name: entries, type: array, of: offered_function, max: 16}]
      - name: describe
        op: 0x03
        request: [{name: function, type: u16}, {name: first, type: u8}]
        result: [{name: tlv, type: bytes}]
      - name: plan_apply
        op: 0x04
        request: [{name: tlv, type: bytes}]
        result: [{name: lease, type: u16}, {name: tlv, type: bytes}]
      - name: plan_release
        op: 0x05
        request: [{name: lease, type: u16}]
        result: []
      - name: stop
        op: 0x06
        request: [{name: activity, type: u16}]
        result: []
      - name: ping
        op: 0x07
        request: [{name: data, type: bytes}]
        result: [{name: data, type: bytes}]

  - name: probe_identity
    owner: 0x0000
    id: 0x0001
    revision: 0
    operations:
      - name: get
        op: 0x01
        request: []
        result: [{name: profile_id, type: u32}, {name: firmware_revision, type: u32},
                 {name: reserved_pin_mask, type: u64}, {name: fixture_pin_mask, type: u64}]

  - name: target_control
    owner: 0x0000
    id: 0x0010
    revision: 0
    operations:
      - name: status
        op: 0x01
        request: []
        result: [{name: flags, type: u8}, {name: start_mode, type: u8}, {name: boot_status, type: u8}]
      # reset completes only when the probe has evidence that the hart runs
      # after the reset. DMSTATUS alone is not evidence: on CH32X035 the hart
      # stays parked at the reset vector in ~4 % of debug resets while DMSTATUS
      # says allrunning (E158, 2026-09-22). mode 0 = system reset then run.
      # mode 0 = system reset through the debug module (ndmreset), the target runs its
      # application. mode 1 = product bootloader: on QingKe V2 parts with the UIAPduino
      # bootloader the probe injects the E129 RAM payload (BOOT_MODE, PD4/USB D- low as a
      # detach, PFIC software reset executed by the CPU) so the part re-enumerates as HID
      # 1209:b803; mode 2 = normalise to user mode the same way (E130: clear BOOT_MODE,
      # software reset). Modes 1/2 are rejected (unavailable) where the profile has no
      # payload; confirm is ignored for them and flags bit0 says the payload ran.
      # confirm 0 = report the DM view only; 1 = also halt briefly, sample the
      # PC, resume; a sample at the reset vector counts as "parked, released by
      # the resume" and is re-sampled, a failed halt redoes the reset sequence.
      # flags: bit0 DM reports running, bit1 execution confirmed by a nonzero PC
      # sample, bit2 the hart was parked or the sequence was redone, bit3 the
      # confirmation halt failed. pc = the confirming sample.
      - name: reset
        op: 0x02
        request: [{name: mode, type: u8}, {name: confirm, type: u8}]
        result: [{name: flags, type: u8}, {name: attempts, type: u8}, {name: pc, type: u32}]
      - name: halt
        op: 0x03
        request: []
        result: []
      - name: resume
        op: 0x04
        request: []
        result: []
      # Debug-module visibility for diagnosis and HIL assertions (2026-09-22): a
      # raw DMI register and an abstract-command register read while halted.
      - name: read_dmi
        op: 0x10
        request: [{name: address, type: u8}]
        result: [{name: value, type: u32}]
      - name: read_register
        op: 0x11
        request: [{name: regno, type: u16}]
        result: [{name: value, type: u32}]

  - name: target_memory
    owner: 0x0000
    id: 0x0011
    revision: 0
    operations:
      - name: read
        op: 0x01
        request: [{name: address, type: u32}, {name: length, type: u16}]
        result: [{name: data, type: bytes}]
      - name: write
        op: 0x02
        request: [{name: address, type: u32}, {name: data, type: bytes}]
        result: [{name: written, type: u16}]

  - name: target_flash
    owner: 0x0000
    id: 0x0012
    revision: 0
    operations:
      - name: geometry
        op: 0x01
        request: []
        result: [{name: base, type: u32}, {name: size, type: u32}, {name: page, type: u16}, {name: program_unit, type: u16}]
      - name: erase_page
        op: 0x02
        request: [{name: address, type: u32}]
        result: []
      - name: program_page
        op: 0x03
        request: [{name: address, type: u32}, {name: data, type: bytes}]
        result: []
      - name: verify_crc32
        op: 0x04
        request: [{name: address, type: u32}, {name: length, type: u32}]
        result: [{name: crc32, type: u32}]

  - name: fixture_gpio
    owner: 0x0000
    id: 0x0020
    revision: 0
    operations:
      - name: configure
        op: 0x01
        request: [{name: channel, type: u8}, {name: mode, type: u8}]
        result: []
      - name: read_bank
        op: 0x02
        request: []
        result: [{name: available, type: u64}, {name: values, type: u64}]

  - name: fixture_uart
    owner: 0x0000
    id: 0x0021
    revision: 0
    operations:
      - name: configure
        op: 0x01
        request: [{name: baud, type: u32}]
        result: [{name: actual_baud, type: u32}]
      - name: write
        op: 0x02
        request: [{name: data, type: bytes}]
        result: [{name: written, type: u16}]
      - name: read
        op: 0x03
        request: [{name: maximum, type: u16}]
        result: [{name: data, type: bytes}]

  # ---- common tool: sampled logic capture, a read-only observer (2026-09-22) ----
  # Plan roles: role k (0..7) = line k, channel = the probe pin to sample. The
  # capture never drives a channel, so its channels may also belong to another
  # function in the same plan or in an existing lease (e.g. observe the SCL/SDA
  # that fixture.i2c-target or the DUT is using). One sample = one byte, bit k =
  # level of line k. configure sets the rate and the length; arm starts sampling
  # at once and stops after `samples`; read returns sample bytes from `offset`.
  # Decoding (I2C, SPI, UART) is host-side so a low-spec probe only samples.
  - name: fixture_capture
    owner: 0x0000
    id: 0x0022
    revision: 0
    operations:
      - name: configure
        op: 0x01
        request: [{name: sample_rate_hz, type: u32}, {name: samples, type: u32}]
        result: [{name: actual_sample_rate_hz, type: u32}, {name: samples, type: u32}, {name: lines, type: u8}]
      - name: arm
        op: 0x02
        request: []
        result: []
      # flags: bit0 configured, bit1 running, bit2 complete, bit3 error
      - name: status
        op: 0x03
        request: []
        result: [{name: flags, type: u8}, {name: samples, type: u32}]
      - name: read
        op: 0x04
        request: [{name: offset, type: u32}, {name: maximum, type: u16}]
        result: [{name: data, type: bytes}]

  # ---- vendor tool: ESP32-P4 hardware I2C target (ESP-IDF slave v1), E147-E150 ----
  # Modes: 1 fixed_rx (one write of exactly `length` bytes per arm), 2 framed_rx
  # (1-byte length header transaction, then a payload transaction of that length),
  # 3 preloaded_tx (host preloads fixed response slots; each slot carries one
  # filler byte after the payload, E150). Roles for the plan: 1 = SDA, 2 = SCL.
  - name: p4_i2c_target
    owner: 0x0100
    id: 0x0001
    revision: 0
    operations:
      - name: configure
        op: 0x01
        request: [{name: address, type: u8}, {name: mode, type: u8}]
        result: []
      - name: arm_rx
        op: 0x02
        request: [{name: length, type: u16}]
        result: []
      - name: read_rx
        op: 0x03
        request: []
        result: [{name: pending, type: u8}, {name: data, type: bytes}]
      - name: preload_tx
        op: 0x04
        request: [{name: data, type: bytes}]
        result: [{name: slots, type: u8}]
      - name: status
        op: 0x05
        request: []
        result: [{name: flags, type: u8}, {name: rx_frames, type: u32}, {name: tx_slots, type: u8}, {name: errors, type: u16}]
      - name: reset
        op: 0x06
        request: []
        result: []
      # Vendor debug view of the ESP32-P4 I2C0 slave hardware after a transaction:
      # status (sr), raw interrupt flags, FIFO status, control. Numbers are IDF/SoC
      # register images and mean nothing outside this probe (2026-09-22, worklist B).
      - name: read_hw
        op: 0x10
        request: []
        result: [{name: sr, type: u32}, {name: int_raw, type: u32}, {name: fifo_st, type: u32}, {name: ctr, type: u32},
                 {name: slave_addr, type: u32}, {name: filter_cfg, type: u32}, {name: scl_stretch_conf, type: u32}]
      # Deliberate SCL stretching for master tests (2026-09-22, X035 worklist P3 row 6): with a
      # nonzero stretch_us the ESP-IDF slave stretches SCL at address match / TX empty / RX full /
      # ACK, and the probe holds each stretch for stretch_us before the driver releases it.
      # 0 = off (default). Takes effect at the next configure. Bounded to 100000 us.
      - name: set_stretch
        op: 0x11
        request: [{name: stretch_us, type: u32}]
        result: []

  # ---- vendor tool: ESP32-P4 hardware SPI target (ESP-IDF spi_slave, SPI2_HOST), 2026-09-22 ----
  # One CS-framed transaction at a time: arm() queues it with the MISO bytes to send (zero
  # padded to `length`); after the master raises CS, read_rx() returns what came in on MOSI
  # and the transaction length in bits. Roles for the plan: 1 = SCK, 2 = MOSI, 3 = MISO, 4 = CS.
  # mode 0..3 = (CPOL, CPHA); bit_order 0 = MSB first, 1 = LSB first. No DMA: max 64 bytes.
  - name: p4_spi_target
    owner: 0x0100
    id: 0x0002
    revision: 0
    operations:
      - name: configure
        op: 0x01
        request: [{name: mode, type: u8}, {name: bit_order, type: u8}]
        result: []
      - name: arm
        op: 0x02
        request: [{name: length, type: u16}, {name: tx, type: bytes}]
        result: []
      - name: read_rx
        op: 0x03
        request: []
        result: [{name: pending, type: u8}, {name: bits, type: u32}, {name: data, type: bytes}]
      - name: status
        op: 0x04
        request: []
        result: [{name: flags, type: u8}, {name: transactions, type: u32}, {name: errors, type: u16}]
      - name: reset
        op: 0x05
        request: []
        result: []
