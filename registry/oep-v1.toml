  { code = 0x12, name = "stop", lock = true },
  { code = 0x13, name = "force", lock = true },
  { code = 0x14, name = "status", lock = false },       # state(u8) start_ns(u64) trigger_ns(u64) trigger_fn(u16) generation(u32)
