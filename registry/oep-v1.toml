off = 0
retry_with_reset = 1
[interface.enum.slot_state]
connected = 0
absent = 1
lock_mismatch = 2
no_target_id = 3
[interface.enum.bind_mode]
last_reset = 0
manual = 1
mixed = 2
[interface.enum.bind_stream]
slot_console = 1
fixture_uart = 2
[interface.enum.bind_flow]
idle = 0
streaming = 1
