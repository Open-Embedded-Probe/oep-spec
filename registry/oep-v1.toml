  { code = 0x01, name = "configure", lock = true },
  { code = 0x02, name = "read", lock = false, closed_tail = true },
  { code = 0x03, name = "marks", lock = false },
  { code = 0x04, name = "clear", lock = true },
  { code = 0x05, name = "mark", lock = true },
  { code = 0x06, name = "write", lock = true },
