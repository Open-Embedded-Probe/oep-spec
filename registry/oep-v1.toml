# OEP v1 registry: every number on the wire, in one place (2026-09-25, working toward the freeze).
# The spec text is docs/oep-core.md (the core) and docs/oep-if-*.md (the standard interfaces). tools/oepgen1.py generates
# the C++ header and the Python and JS modules from this file; `oepgen1.py --check` fails when the committed outputs drift.
# Numbers only: payload layouts stay in the spec tables. TLV tags live in the context of one (interface, op) or one
# declaration; the same value in another context is another tag (core §2.2).
# Per op: `lock` = needs the session lock; `closed_tail = true` = the response ends with a list of unknown length,
# so nothing can be appended after it (core §2.3: only fn 0's link_source). The key `fields` is reserved on ops for
# payload layouts later (encoders / decoders generated from here). Shared enums live under [common.enum.*]; USB
# descriptor constants under [usb]; text and value limits the spec states under [limits] (2026-10-01).
# The hash embedded in the generated files is the sha256 of this file with line endings normalized to LF.
# Per interface: `reserved.<enum or "op">` = ranges [[lo, hi]] no value may use; `status` / `reject_reasons` = the
# interface's own values (0x40-0x7F). Common describe tags ([describe_common]) are not repeated in an interface.
# TLV tags are written as their number, the low 7 bits (core §2.2); a request sets bit 7 itself when it sends one critical.
# A request tag appears at most once unless its comment says `repeats` (core §2.3).
# In every u8 enum, 0xF0-0xFE are experimental unless the enum says otherwise: never registered (core §2.5).

[registry]
schema = 1

[protocol]
name = "oep"
revision = 1
byte_order = "little"

[constants]
confirm_request_magic = "OEP?"
confirm_result_magic = "OEP!"
role_session_flag = 0x80        # bit 7 of a request's role: a session id follows the header
tag_critical = 0x80             # bit 7 of a TLV tag in a request: the probe must honour it or refuse
tag_ignored = 0x7F              # in every context: a response TLV listing the non-critical tags the probe ignored
tag_invalid = 0xFF
tag_reserved_zero = 0x00        # never a TLV tag; the rejected unsupported payload's "fixed-part value" marker (core §4.3)
tlv_len_long = 0xFF             # a TLV whose len byte is 0xFF carries a u16 len next (values of 255+ bytes; core §2.2)
min_max_frame = 64              # every probe takes messages this long; a host sends no longer message before confirm answers (core §3.3)

[roles]
request = 0x01
result = 0x02
event = 0x05
data = 0x06

[resolutions]
rejected = 0x00
completed = 0x01
accepted = 0x02                 # reserved: v1 has no long operations (core §10); a host treats it as a failure

[outcomes]                      # the detail byte of a completed result
success = 0x00
failed = 0x01
partial = 0x02

[reject_reasons]                # 0x01-0x3F core, 0x40-0x7F per interface, 0x80-0xFF reserved
unknown_function = 0x01
unknown_operation = 0x02
malformed = 0x03
unavailable = 0x04
busy = 0x05                     # reserved with the long operations (core §10)
window_exceeded = 0x06
no_session = 0x07
locked = 0x08
session_required = 0x09
no_connection = 0x0A
unsupported = 0x0B
result_lost = 0x0C              # a resend whose answer is not kept (it fell out of the table, or was too large): read the state again (core §5.2)
corr_reused = 0x0D              # a request sent again with the same corr but another fn, op or payload
expired = 0x0E                  # this session's lock ended by lease expiry and its resources were swept: open again (core §6.2); the side forced out sees locked, then no_session (core §9)

[status]                        # wire and target operations (oep-if-common §3); 0x06-0x3F reserved, 0x40-0x7F per interface
ok = 0
wait = 1
line = 2
fault = 3
timeout = 4
state = 5

[timing]                        # times and line values host and probe both implement (core §3.2, §3.4, §5.1, §11)
resync_quiet_ms = 50            # host: read and discard until the input is this quiet, then confirm
probe_frame_gap_ms = 200        # probe: a pause this long inside a frame restarts its reader (not on TCP; core §3.2)
host_resync_wait_ms = 250       # host: before a resync's confirm, and the first confirm on a length-prefixed port, this long since its last write (core §5.1)
uart_bridge_boot_baud = 115200  # a UART bridge's boot speed, 8N1 without flow control (core §3.4)
host_frame_pause_max_ms = 100   # host: never pause inside one frame longer than this
heartbeat_default_ms = 1000     # fn 0 subscription with max_delay_ms 0
port_speed_idle_max_ms = 3000   # a raised port_speed goes back after this long without a good frame, whatever idle_ms said (core §3.5)
host_wait_add_ms = 1000         # host: waits at least the request's argument time (at most max_op_ms) plus this plus the transfer time (core §4.4)
notify_pending_max_frames = 2   # probe: at most max_frame x this of notifications waiting in one transport's send buffer; beyond it they are dropped (core §11.4)
slot_retry_reset_hold_ms = 20   # probe: hold_ms of the retry with reset of a boot_reset slot (oep-if-probe-config §3.1)

[describe_common]               # declaration tags every interface's describe may use (core §7.4); 0x04 reserved, 0x3F response meta
role_channels = 0x01
max_clock_hz = 0x02
max_length = 0x03
min_clock_hz = 0x05
features = 0x06
implementation = 0x07
channel_group = 0x08            # group(u8) n(u8) n x (role(u8) channel(u16))

[usb]                           # the shape of a probe's interfaces inside a device known to be OEP (core §3.3)
# The project's USB VID:PID is listed here when it is obtained. None is listed yet, so no device is
# identified automatically (core §3.3). Neither these values nor iProduct identify an OEP probe on their own.
vendor_bulk_class = 0xFF
vendor_bulk_subclass = 0x4F     # 'O'
vendor_bulk_protocol = 0x45     # 'E'
hid_usage_page = 0xFF4F
hid_usage = 0x45

[limits]                        # values the spec text states; generated code may check them
lease_min_ms = 1000
lease_max_ms = 60000
owner_max_bytes = 32
unit_id_max_bytes = 32
slot_name_max_bytes = 32
label_max_bytes = 32            # probe.config label text: valid UTF-8 without control characters (oep-if-probe-config §1)
interface_name_max_bytes = 64
ignored_max_entries = 16        # entries of the ignored TLV; 0x00 as the 16th = more were ignored (core §2.3)
max_op_ms_reference = 10000     # what the reference firmware declares (core §7.5 max_op_ms has no normative default)
resource_reuse_distance = 1024  # a closed resource number is not reused among the most recently closed this many (core §9)
dm_wait_ms = 100                # riscv-dm: one wait for a DM state inside a high-level op (oep-if-debug §4)
dmi_busy_retries = 100          # riscv-dm: DMI busy is retried this many times, then status wait (oep-if-debug §4)
reset_wait_ms = 100             # riscv-dm reset: wait for the hart after releasing ndmreset, per attempt (oep-if-debug §4.3)
reset_retries = 1               # riscv-dm reset: the sequence is repeated at most this many times (flags bit2) (oep-if-debug §4.3)
swd_wait_retries = 100          # arm-adi transfer: WAIT is retried this many times, then status wait (oep-if-debug §6)

[common.enum.read_from]         # positioned streams (oep-if-common §1.2)
position = 0
oldest = 1
now = 2
last_mark = 3
[common.enum.read_flags]        # read's flags byte (oep-if-common §1.2, oep-if-capture §3.2)
more = 0x01
gap = 0x02
[common.enum.mark_kind]         # 0x01-0x3F standard, 0x40-0x7F per interface (oep-if-common §1.3)
reset = 0x01
restart = 0x02
attach = 0x03
detach = 0x04
lost = 0x05
clear = 0x06
host = 0x07
link_lost = 0x08
closed = 0x09
[common.enum.mark_detail_reset]
ndmreset = 1
nrst = 2
attach_reset = 3                # the attach request's reset TLV (NRST)
[common.enum.mark_detail_restart]
havereset = 1
resync = 2                      # the console mechanism resynchronized
[common.enum.mark_detail_lost]
overflow = 1
framing = 2
parity = 3
target_timeout = 4              # dmseq: the target gave up waiting for the probe
[common.enum.mark_detail_closed]
all_released = 1
expired = 2                     # lease expiry or force removed the last user
slot_changed = 3
connection_closed = 4

# ---- interfaces ------------------------------------------------------------------------------------------------

[[interface]]
name = "oep.core"
fn = 0
revision = 1
op = [
  { code = 0x01, name = "confirm", lock = false },     # answer carries boot_id (core §7.1)
  { code = 0x02, name = "list", lock = false },
  { code = 0x03, name = "describe", lock = false },
  { code = 0x04, name = "plan_apply", lock = true },
  { code = 0x05, name = "plan_release", lock = true },
  { code = 0x10, name = "open", lock = false },
  { code = 0x11, name = "end", lock = true },
  { code = 0x12, name = "keepalive", lock = true },
  { code = 0x13, name = "lock_state", lock = false },
  { code = 0x14, name = "port_speed", lock = true },   # optional: a UART bridge's speed raised for the session (core §3.5)
  { code = 0x30, name = "subscribe", lock = true },
  { code = 0x32, name = "unsubscribe", lock = true },
  { code = 0x40, name = "link_source", lock = false, closed_tail = true },
  { code = 0x41, name = "link_sink", lock = false },
]
[interface.tlv.plan_apply]
role_assignment = 0x10          # repeats; always sent critical (0x90): fn(u16) role(u8) channel(u16); one assignment is identified by all three (core §8)
[interface.tlv.confirm_answer]
transport = 0x01                # u8: the index of the transport this confirm came on (0xFF: a relaying broker); always sent (core §7.1)
[interface.tlv.open]
owner = 0x01                    # text (1-32 bytes): who holds the lock, for display (core §6.4)
[interface.tlv.lock_state_answer]
owner = 0x01                    # the lock holder's owner text, when its open gave one
[interface.tlv.locked_payload]  # the rejected locked payload's tail, after remaining_ms(u32)
owner = 0x01
[interface.tlv.unavailable_payload]   # the rejected unavailable payload (core §4.3), every fn; 0x40+ per interface
cause = 0x01                    # u8, enum unavailable_cause
channel = 0x02                  # u16, may repeat
holder_fn = 0x03                # u16
holder_kind = 0x04              # u8, enum holder_kind
fn = 0x05                       # u16: the fn the refusal is about (a track in capture-group's bind)
[interface.tlv.unsupported_payload]   # the rejected unsupported payload after tag(u8) (0x00 = a fixed-part value), every fn (core §4.3)
supported = 0x01                # confirm only: min(u8) max(u8), the protocol revisions the probe handles (core §7.1)
channel = 0x02                  # u16
fn = 0x05                       # u16: the fn the refusal is about (a track not in capture-group's tracks)
index = 0x40                    # u8: the position in the request's list (gpio set)
[interface.tlv.describe]        # the probe itself (fn 0); declarations only (core §7.3)
firmware = 0x40
model = 0x41
unit_id = 0x42
channels = 0x43
reserved = 0x44
profile = 0x45
label = 0x46                    # channel(u16) text: the firmware's fixed channel names (settings' labels: probe.config get)
resets_on_open = 0x47
transport = 0x49                # index(u8) kind(u8) interface(u8, 0xFF not USB): one per transport; required (0x48 reserved)
discoverable = 0x4A             # u8: 1 = the probe also enumerates with the project's USB VID:PID (core §3.3, §7.5); 0 until that VID:PID is listed in [usb]
plan_roles = 0x4B               # u32: the most role assignments the plan holds at once, every fn together (core §8)
chip = 0x4C                     # text: the probe MCU's part and revision (optional)
max_op_ms = 0x4D                # u32: the longest one request may take; required (core §7.5)
port_speed = 0x4E               # u8 1: the probe takes op port_speed (core §3.5)
[interface.enum.unavailable_cause]
pin_in_use = 1
limit = 2
storage_full = 3
bound_in_group = 4
held_by_settings = 5
wrong_state = 6
[interface.enum.holder_kind]
plan = 1
connection = 2
slot = 3
bind = 4
settings_plan = 5
disabled = 6                    # a channel the settings' disable item takes out (oep-if-probe-config §1)
[interface.enum.transport_kind] # describe transport (core §7.5); 1-3 are serial ports (core §3.4)
uart_bridge = 1
usb_cdc = 2
usb_serial_jtag = 3             # built-in USB serial: the MCU hardware's USB serial port, whose descriptors the probe cannot choose (core §7.5)
vendor_bulk = 4
hid = 5
tcp = 6
[interface.enum.port_speed_step]   # op port_speed's step (core §3.5)
try = 0
commit = 1
revert = 2
[interface.enum.resumed]        # open's answer (core §6.4)
new = 0
resumed = 1                     # the same session id, resources kept
swept = 2                       # the same session id after its lease expired: resources were removed (core §6.4)
[interface.event]
heartbeat = 0x01                # boot_id(u32), uptime_ns(u64)
[interface.reserved]
op = [[0x20, 0x2F]]             # the long operations (core §10)
"tlv.describe" = [[0x48, 0x48], [0x3F, 0x3F]]

[[interface]]
name = "oep.wire.rvswd"
revision = 1
op = [
  { code = 0x01, name = "scan", lock = true },
  { code = 0x02, name = "attach", lock = true },
  { code = 0x03, name = "detach", lock = true },
  { code = 0x05, name = "connections", lock = false },  # first(u8) -> more, count x (len, entry)
]
[interface.reserved]
op = [[0x04, 0x04]]             # was attach_under_reset; now attach's reset TLV (oep-if-debug §3)
[interface.tlv.describe]
max_connections = 0x40          # u8: live connections at once (absent = 1; oep-if-debug §1)
[interface.enum.connection_users] # connections entry users bits (oep-if-debug §2.1)
host_session = 0x01
slot = 0x02
[interface.tlv.scan]
max_speed = 0x01                # u32 Hz (absent: the probe's slowest)
skip = 0x02                     # u16, count 0 only: pairs of the count-0 list to skip (oep-if-debug §1)
idle_clock = 0x04               # u8: SWCLK while the line rests during the scan, 0 high / 1 low
[interface.tlv.detach]
force = 0x01                    # critical, empty
[interface.tlv.attach]
max_speed = 0x01                # critical, u32 Hz; required
pins = 0x03                     # critical: swdio(u16) swclk(u16) - the pair to attach on
idle_clock = 0x04               # critical, u8: SWCLK while the line rests, 0 high / 1 low (oep-if-debug §3)
reset = 0x05                    # critical: channel(u16) hold_ms(u16) - hold the reset line, then attach (oep-if-debug §3)
[interface.tlv.attach_answer]   # the attach result's tail
target_id = 0x10                # scheme(u8) value: what the probe read of the target's identity (oep-if-debug §1)
dpc = 0x11                      # u32 (8 bytes on RV64): the halted hart's dpc when flags halted is set
[interface.enum.scan_kind]      # the kind byte of a scan entry
riscv_dm = 1
arm_adi = 2
[interface.enum.attach_flags]   # the attach answer's flags, every wire
havereset_acked = 0x01
existing = 0x02
dormant_woken = 0x04
halted = 0x08
[interface.enum.target_id_scheme]
wch_dmi_7f = 1                  # the u32 at DMI address 0x7F (the name: WCH's debug module keeps an identifier there); 0 and all ones = none (not sent)
[interface.enum.target_id_len]  # bytes of each scheme's value (slot locks must match it; oep-if-probe-config §1.1)
wch_dmi_7f = 4
[interface.enum.attach_method]
run = 0
halt = 1
[interface.enum.pin_role]       # the roles of the pins in describe's channel_group / role_channels
swdio = 1
swclk = 2
reset = 3                       # a channel attach's reset TLV may take; no default (oep-if-debug §3)
[interface.enum.idle_clock]     # the idle_clock TLV and probe.config's slot field
high = 0
low = 1

[[interface]]
name = "oep.wire.swio"
revision = 1
op = [
  { code = 0x01, name = "scan", lock = true },
  { code = 0x02, name = "attach", lock = true },
  { code = 0x03, name = "detach", lock = true },
  { code = 0x05, name = "connections", lock = false },
]
[interface.reserved]
op = [[0x04, 0x04]]
[interface.tlv.describe]
max_connections = 0x40          # u8: live connections at once (absent = 1; oep-if-debug §1)
[interface.enum.connection_users] # connections entry users bits (oep-if-debug §2.1)
host_session = 0x01
slot = 0x02
[interface.tlv.scan]
max_speed = 0x01
skip = 0x02                     # u16, count 0 only: pairs of the count-0 list to skip (oep-if-debug §1)
[interface.tlv.detach]
force = 0x01
[interface.tlv.attach]
max_speed = 0x01                # critical, required
pins = 0x03                     # critical: swdio(u16) swclk(u16, 0xFFFF: one wire) - the pair to attach on
reset = 0x05                    # critical: channel(u16) hold_ms(u16)
[interface.tlv.attach_answer]
target_id = 0x10
dpc = 0x11
[interface.enum.scan_kind]
riscv_dm = 1
arm_adi = 2
[interface.enum.attach_flags]
havereset_acked = 0x01
existing = 0x02
dormant_woken = 0x04
halted = 0x08
[interface.enum.target_id_scheme]
wch_dmi_7f = 1                  # the u32 at DMI address 0x7F (the name: WCH's debug module keeps an identifier there); 0 and all ones = none (not sent)
[interface.enum.target_id_len]
wch_dmi_7f = 4
[interface.enum.attach_method]
run = 0
halt = 1
[interface.enum.pin_role]       # the roles of the pins in describe's channel_group / role_channels
swdio = 1
reset = 3

[[interface]]
name = "oep.wire.swd"
revision = 1
op = [
  { code = 0x01, name = "scan", lock = true },
  { code = 0x02, name = "attach", lock = true },
  { code = 0x03, name = "detach", lock = true },
  { code = 0x05, name = "connections", lock = false },
]
[interface.reserved]
op = [[0x04, 0x04]]
[interface.tlv.describe]
max_connections = 0x40          # u8: live connections at once (absent = 1; oep-if-debug §1)
[interface.enum.connection_users] # connections entry users bits (oep-if-debug §2.1); slot is always 0 in v1
host_session = 0x01
slot = 0x02
[interface.tlv.scan]
max_speed = 0x01
skip = 0x02                     # u16, count 0 only: pairs of the count-0 list to skip (oep-if-debug §1)
targetsel = 0x06                # u32: try one multidrop target (absent: none)
[interface.tlv.detach]
force = 0x01
[interface.tlv.attach]
max_speed = 0x01                # critical, required
targetsel = 0x02                # critical, u32 (multidrop only)
pins = 0x03                     # critical: swdio(u16) swclk(u16) - the pair to attach on
reset = 0x05                    # critical: channel(u16) hold_ms(u16); probes without it refuse unsupported
[interface.tlv.attach_answer]
target_id = 0x10                # not sent in v1 (no scheme for swd)
dpc = 0x11                      # not sent in v1 (method 1 is unsupported)
[interface.enum.scan_kind]
riscv_dm = 1
arm_adi = 2
[interface.enum.attach_flags]
havereset_acked = 0x01
existing = 0x02
dormant_woken = 0x04
halted = 0x08
[interface.enum.target_id_scheme]
targetsel = 2                   # connections entries only: the u32 TARGETSEL (0 when none); never a slot lock
[interface.enum.target_id_len]
targetsel = 4
[interface.enum.attach_method]
run = 0                         # halt (1) is rejected unsupported on swd
[interface.enum.pin_role]       # the roles of the pins in describe's channel_group / role_channels
swdio = 1
swclk = 2
reset = 3

[[interface]]
name = "oep.target.riscv-dm"
revision = 1
op = [
  { code = 0x01, name = "dmi", lock = true },
  { code = 0x02, name = "halt", lock = true },
  { code = 0x03, name = "resume", lock = true },
  { code = 0x04, name = "reset", lock = true },
  { code = 0x05, name = "read_block", lock = true },
  { code = 0x06, name = "write_block", lock = true },
  { code = 0x07, name = "run", lock = true },
  { code = 0x08, name = "step", lock = true },
]
[interface.tlv.describe]        # plus the common tags (features 0x06, enum features)
[interface.tlv.reset]
method = 0x01
[interface.tlv.read_block]
address_hi = 0x01               # reserved: critical u32, the upper address bits (RV64); not in v1
[interface.tlv.write_block]
address_hi = 0x01               # reserved
[interface.enum.features]       # describe features bits
block = 0x01
run = 0x02
reset = 0x04
step = 0x08
[interface.enum.run_stopped]    # run answer's stopped byte (oep-if-debug §4.4)
timeout_halted = 0              # the limit passed; the probe halted the hart (dpc and values valid)
stopped = 1
not_halted = 2                  # the limit passed and the hart could not be halted (dpc invalid, nvals 0)
[interface.enum.reset_flags]    # reset answer's flags (oep-if-debug §4.3)
reached = 0x01
verified = 0x02
retried = 0x04
confirm_failed = 0x08
[interface.reserved]
dmi_step = [[0x10, 0x1F]]       # the same steps with a u32 address
[interface.enum.dmi_step]
write = 0x01
read = 0x02
poll_reads = 0x03
wait_us = 0x04
poll_us = 0x05
[interface.enum.reset_mode]
run = 0
run_verified = 1
halt_at_reset = 2
[interface.enum.reset_method]
probe_default = 0
ndmreset = 1
system_reset = 2                # reserved: no common procedure (oep-if-debug §4.3)

[[interface]]
name = "oep.target.arm-adi"
revision = 1
op = [
  { code = 0x01, name = "transfer", lock = true },
  { code = 0x02, name = "read_block", lock = true },
  { code = 0x03, name = "write_block", lock = true },
]
[interface.tlv.read_block]
address_hi = 0x01               # reserved: 64-bit AP addresses; not in v1
[interface.tlv.write_block]
address_hi = 0x01               # reserved
[interface.enum.swd_ack]        # transfer answer's ack: line order, bit0 first (oep-if-debug §6)
ok = 1
wait = 2
fault = 4

[[interface]]
name = "oep.target.console"
revision = 1
op = [
  { code = 0x01, name = "open", lock = true },
  { code = 0x02, name = "read", lock = false },
  { code = 0x03, name = "marks", lock = false },
  { code = 0x04, name = "clear", lock = true },
  { code = 0x05, name = "mark", lock = true },
  { code = 0x06, name = "write", lock = true },
  { code = 0x07, name = "close", lock = true },
  { code = 0x08, name = "streams", lock = false },      # first(u8) -> more, count x (len, entry)
]
[interface.tlv.describe]
mechanisms = 0x40               # u8 list: the mechanisms this probe opens (required; oep-if-console §1)
[interface.enum.mechanism]      # read_from / mark_kind / mark details: [common.enum.*]
sdi = 0
dmdata = 1
dmseq = 2
none = 0xFF                     # probe.config slot: no console (never opened)
[interface.enum.open_flags]
existing = 0x01
[interface.enum.stream_state]   # streams entry (oep-if-console §1)
open = 0
closed = 1                      # still readable until the next open at the same place
[interface.enum.stream_users]
host_session = 0x01
slot = 0x02

[[interface]]
name = "oep.fixture.gpio"
revision = 1
op = [
  { code = 0x01, name = "set", lock = true },
  { code = 0x02, name = "read", lock = false },
]
[interface.tlv.describe]
modes = 0x40                    # u32 bit set: bit n = mode n is supported (0 input required)
drive_levels = 0x41             # default(u8) n(u8) n x ma(u16 ascending): selectable output strengths (oep-if-fixture §1.1); absent = not switchable
[interface.tlv.set]
drive = 0x01                    # repeats; non-critical: index(u8) kind(u8) value(u16): the strength of one mode 3 / 4 element
[interface.tlv.read_answer]
drive = 0x01                    # n x u8: the level each channel is driven at in mode 3 / 4, 0xFF when not; only with drive_levels
[interface.tlv.unavailable_payload]   # set / read refusal, after the core TLVs (core §4.3); unsupported uses the same index tag
