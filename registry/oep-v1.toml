  { code = 0x1B, name = "triggers", lock = false },  # generation(u32) from_serial(u32) -> more count records (oep-if-capture §3.10)
  { code = 0x19, name = "calibration", lock = false },  # optional (ops); capture §3.7
  { code = 0x01, name = "subscribe", lock = true },  # required in mode 3, optional otherwise (ops), with unsubscribe; core §10.3
  { code = 0x02, name = "unsubscribe", lock = true },    # optional (ops), with subscribe
]
[interface.tlv.configure]       # also the request of query; mode and rate required (oep-if-capture §3.3)
mode = 0x01
rate = 0x02
samples = 0x03
segments = 0x04
trigger = 0x05                  # type(u8) role(u8) value(u32)
pretrigger = 0x06
frontend = 0x07                 # repeats, one per channel: role(u8) frontend(u8) (oep-if-capture §3.3)
format = 0x08                   # u8: the data format (oep-if-capture §1; data_format), critical when not 0
carriage = 0x09                 # critical: role(u8) kind(u8) d(u32) with format 1 / 2 (oep-if-capture §1.3 / §1.4)
coupling = 0x0D                 # critical: role(u8) kind(u8: 0 DC, 1 AC, 2 GND) (oep-if-capture §3.8)
offset = 0x0E                   # critical: role(u8) mv(i32)
format_name = 0x10             # critical: the named format (oep-if-capture §1), with format 0xFF
data_path = 0x11               # path(u8: 0 OEP, 1 external) mux(u8) kind(u8) (oep-if-capture §3.9); path 1 critical
trigger_opts = 0x0A             # critical: arm(u8) rearm(u8) when(u8) hysteresis(u32) (oep-if-capture §3.3)
block_max = 0x0B                # u32: the most original samples a block (oep-if-capture §1.3)
overflow = 0x12                 # u8: 0 refuse past the external capacity, 1 accept with gaps (oep-if-capture §3.9)
bandwidth = 0x14                # critical: role(u8) hz(u32)
resolution = 0x15               # critical: bits(u8)
oversample = 0x16               # critical: ratio(u16); rate is the output rate
[interface.tlv.configure_answer]  # the answer of configure and query
actual_rate = 0x01
layout = 0x02                   # s(u8) o(u8) b(u8, 1-31) C(u8) order[C](u8)
actual_samples = 0x03
actual_segments = 0x04
scale = 0x05                    # repeats, one per channel: role(u8) zero(i32) scale_nv(i32): the pin voltage (attenuation included)
skew = 0x06                     # repeats, one per channel: role(u8) skew_ns(u32)
frontend_used = 0x07            # repeats, one per channel: role(u8) frontend(u8): the frontend each channel took
reference = 0x08                # source(u8, enum reference_source) mv(u32) how(u8, enum reference_how)
format = 0x09                   # u8: the data format in use; required when not 0
block = 0x0A                    # L(u32): original samples a block, formats 1 / 2
coupling_used = 0x0C            # role(u8) kind(u8)
offset_used = 0x0D              # role(u8) mv(i32)
format_name = 0x0E             # the named format in use, with format 0xFF
bandwidth_used = 0x11           # role(u8) hz(u32)
resolution_used = 0x12          # bits(u8)
oversample_used = 0x13          # ratio(u16)
stream_buffer = 0x14            # u32: streaming, the most bytes held unsent (oep-if-capture §3.3); optional
judge_latency_ns = 0x15         # u32: judging a trigger source's condition, the longest to know it (oep-if-capture §3.3, §4.4); optional
[interface.tlv.status_answer]
error = 0x01                    # u8, enum error
[interface.tlv.data]
generation = 0x01               # u32, required in streaming mode
segment_info = 0x02             # position(u64) samples(u32) start_ns(u64) uncertainty(u32); every data frame
[interface.tlv.calibration_answer]   # oep-if-capture §3.7: raw, never applied by the probe
factory = 0x01                  # repeats, one per frontend: frontend(u8, 0xFF any) scheme_len(u8) scheme(text) raw_len(u16) raw
vrefint = 0x02                  # raw(u32) ns(u64) nominal_mv(u32): the internal reference measured at the last start
[interface.tlv.describe]        # plus the common tags (ops 0x07, features 0x05, enum features)
mode = 0x40                     # repeats, one per mode: the maximum (not the current free space)
rate_range = 0x41
channels = 0x42                 # max(u8)
trigger = 0x43                  # types(u32 bit set) max_pretrigger(u32)
frontend = 0x44                 # repeats: frontend(u8), range_min_mv(i32), range_max_mv(i32); scale already refers to the input pin
formats = 0x45                  # u8 list: the data formats besides 0
carriage = 0x46                 # kinds(u8 bits) min_d(u32) max_d(u32): the carriages and the d range above 1
coupling = 0x48                 # frontend(u8) kinds(u8 bits) (oep-if-capture §3.8)
offset = 0x49                   # frontend(u8) min_mv(i32) max_mv(i32) step_mv(u32)
format_names = 0x4A             # text, repeated: the named formats
external_data = 0x4B            # kind(u8) muxes(u8 bits) value: 1 USB bulk IN, 2 TCP, 3 UDP, 4 USB isochronous IN (oep-if-capture §3.9)
trigger_records = 0x52          # u16: the trigger records kept (oep-if-capture §3.10)
bandwidth = 0x4E                # frontend(u8) n(u8) n x hz(u32)
impedance = 0x4F                # frontend(u8) ohms(u32) pf(u32)
resolution = 0x50               # n(u8) n x (bits(u8) max_rate_hz(u32))
oversample = 0x51               # n(u8) n x ratio(u16)
[interface.event]               # as oep.fixture.logic: every event carries its generation
segment = 0x01
stopped = 0x02                  # reason(u8) error(u8) generation(u32)
triggered = 0x03                # serial(u32) trigger_index(u32) trigger_ns(u64) generation(u32)
[interface.enum.external_kind]  # oep-if-capture §3.9
usb_bulk_in = 1
tcp = 2
udp = 3                         # each packet a 16-byte header (position, generation, fn)
usb_iso_in = 4                  # likewise
[interface.enum.external_mux]
single = 0
chunks = 1                      # fn(u16) len(u16) chunks
[interface.enum.data_path]
oep = 0
external = 1
[interface.enum.data_format]     # oep-if-capture §1; OEP adds numbers
packed = 0
logic_blocks = 1
analog_blocks = 2
state_timed = 3                 # §3.8: per sample delta(u32 timebase ticks) + state, with an external clock
test_counter = 4                # §1: byte k is k & 0xFF, at the format 0 volume and rate (measures the path)
named = 0xFF                    # a reverse-DNS name in format_name (oep-if-capture §1)
[interface.enum.analog_carriage] # bits (oep-if-capture §1.4): packed alone, minmax and sum together
packed = 0x01
minmax = 0x02
sum = 0x04
[interface.enum.features]       # none in revision 1; unused values are unallocated (query, force, subscribe and unsubscribe are declared by ops)

[interface.enum.mode]
one_shot = 1
repeat = 2
streaming = 3
[interface.enum.trigger]
immediate = 0
cross_up = 3
cross_down = 4
linked = 7                      # follows the group's trigger_source (oep-if-capture §4.4)
[interface.enum.reference_source]
supply = 0
internal = 1
external = 2
[interface.enum.state]
unconfigured = 0
configured = 1
waiting = 2
capturing = 3
done = 4
