# OEP v1 registry: every number on the wire, in one place (v1, before the freeze: values may still change until then).
# The spec text is docs/oep-core.ja.md and docs/oep-transports.ja.md (the core) and interfaces/*.ja.md (the interfaces whose names begin with oep.). tools/oepgen1.py generates
# the C++ header, the C header and the Python and JS modules from this file; `oepgen1.py --check` fails when the committed outputs drift.
# Numbers only: payload layouts stay in the spec tables. TLV tags live in the context of one (interface, op) or one
# declaration; the same value in another context is another tag (core §2.2).
# Per op: `lock` = needs the session lock. The key `fields` is reserved on ops for
# payload layouts later (encoders / decoders generated from here). Shared enums live under [common.enum.*]; USB
# descriptor constants under [usb]; text and value limits the spec states under [limits] (2026-10-01). After the freeze keys are
# never renamed, only added (versioning §5);
# the hash tells only whether generated code matches this file, nothing about wire compatibility.
# The hash embedded in the generated files is the sha256 of this file with line endings normalized to LF.
# Per interface: `reserved.<enum or "op">` = ranges [[lo, hi]] no value may use; `status` / `reject_reasons` = the
# interface's own values (0x40-0x7F). Common describe tags ([describe_common]) are not repeated in an interface.
# TLV tags are written as their number, the low 7 bits (core §2.2); a request sets bit 7 itself when it sends one critical.
# A tag appears once unless its comment says `repeats`; a reader that meets a non-repeating tag twice uses the first (core §2.3).
# A value, tag or op that v1 removed stays reserved (a comment or a `reserved` range): it is never given another meaning.
#
# Table kinds. The registry uses these and no others; a generator written from this list reads the whole file.
#   [registry]         schema = integer (the layout of this file; 1).
#   [protocol]         name = string, revision = integer, byte_order = string ("little").
#   [constants]        name = integer (u8 unless the comment says otherwise) or string (the 4-byte ASCII confirm magics).
#   [roles] [resolutions] [outcomes] [reject_reasons] [status]
#                      name = integer: a u8 wire value of the core.
#   [timing] [limits]  name = integer: a time (suffix _ms), a size (_bytes), a speed (_baud), or a count; the spec states it.
#   [describe_common]  name = integer: a describe TLV tag (u8, low 7 bits) every interface may use.
#   [usb]              name = integer: a USB descriptor value (the project's VID / PID u16, class / subclass / protocol u8,
#                      HID usage page / usage u16).
#   [common.enum.<enum>]  name = integer: one value space shared by every interface (u8 unless the enum's comment says otherwise).
#   [core]             the core's own numbers (fn 0; the core has no name and is not in list, core §0): the keys and sub-tables of
#                      [[interface]] below except name, revision, fn, target and line_names.
#   [[interface]]      one per interface, with these keys and sub-tables only:
#     name = string, revision = integer, fn = integer (u16; only where the fn is fixed: none in v1),
#     target = string (optional: the target family the interface is for, core §13 rule 8; absent = any family),
#     op = array of inline tables { code = integer (u8), name = string, lock = bool } (`fields` is reserved on ops);
#     [interface.tlv.<context>]   name = integer: a TLV tag (u8, low 7 bits) in that op, answer, payload or declaration;
#     [interface.enum.<enum>]     name = integer: a value of a field, or a bit mask for a bit set (the width is the field's);
#     [interface.event]           name = integer: an event kind (u8, 0x01-0x7F);
#     [interface.status] [interface.reject_reasons]   name = integer: the interface's own values (0x40-0x7F; none yet);
#     [interface.reserved]        key = "op", an enum name, or "tlv.<context>"; value = array of [lo, hi] integer ranges;
#     [interface.line_names]      name = string: a standard name and its description (1-32 of a-z 0-9 _ -, no x- prefix).
# A new table kind, or a new key of [[interface]] or of an op, is a registry change made by a pull request (CONTRIBUTING.md).

[registry]
schema = 1

[protocol]
name = "oep"
revision = 1
byte_order = "little"

[constants]
confirm_request_magic = "OEP?"
confirm_result_magic = "OEP!"
tag_critical = 0x80             # bit 7 of a TLV tag in a request: a probe that does not implement the tag refuses (core §2.3)
tag_reserved_zero = 0x00        # never a TLV tag; the rejected unsupported payload's "fixed-part value" marker (core §4.3)
# 0x7F: never a TLV tag, in every context (core §2.5; was the ignored list)
min_max_frame = 64              # every probe takes messages this long; a host sends no longer message before confirm answers (transports §3)
op_subscribe = 0x30             # reserved in every interface's op space: subscribe of the interface that sends notifications (core §11.3)
op_unsubscribe = 0x32           # reserved in every interface's op space: unsubscribe (core §11.3)

[roles]
request = 0x01
result = 0x02
event = 0x05
data = 0x06

[resolutions]
rejected = 0x00
completed = 0x01
accepted = 0x02                 # reserved; a host treats an unknown resolution as a failure (core §2.4)

[outcomes]                      # the detail byte of a completed result
success = 0x00
failed = 0x01
partial = 0x02

[reject_reasons]                # 0x01-0x3F core, 0x40-0x7F per interface, 0x80-0xFF reserved
unknown_function = 0x01
unknown_operation = 0x02
malformed = 0x03
unavailable = 0x04
busy = 0x05                     # reserved
window_exceeded = 0x06
no_session = 0x07               # a request with a session_id while no session holds the lock: open a new session (core §6.2, §9)
locked = 0x08
session_required = 0x09
no_connection = 0x0A
unsupported = 0x0B
result_lost = 0x0C              # a resend whose answer is not kept (it fell out of the table, or was too large): read the state again (core §5.2)
# 0x0D reserved (was corr_reused), 0x0E reserved

[status]                        # wire and target operations (oep-if-common §3); 0x06-0x3F reserved, 0x40-0x7F per interface
ok = 0
wait = 1
line = 2
fault = 3
timeout = 4
state = 5

[timing]                        # times and line values host and probe both implement (transports §2, §4, §5; core §11)
probe_frame_gap_ms = 200        # probe: a pause this long inside a frame restarts its reader (not on TCP; transports §2); a host waits longer than this before a resync's confirm (transports §5)
uart_bridge_boot_baud = 115200  # a UART bridge's boot speed, 8N1 without flow control (transports §4)
port_speed_idle_max_ms = 3000   # a raised port_speed goes back after this long without a good frame, whatever idle_ms said (oep-if-link §3)
host_wait_add_ms = 1000         # host: waits at least the request's argument time (at most max_op_ms) plus this plus the transfer time (core §4.4)
notify_pending_max_frames = 2   # probe: at most max_frame x this of notifications waiting in one transport's send buffer; beyond it they are dropped (core §11.4)
slot_retry_reset_hold_ms = 20   # probe: hold_ms of the retry with reset of a boot_reset slot (oep-if-probe-config §3.1)
port_speed_switch_wait_ms = 20  # host: after the answer to try, at least this long at the new speed before the confirm that verifies it (oep-if-link §3 host obligation 2)

[describe_common]               # declaration tags every interface's describe may use (core §7.4); 0x04, 0x07 (was implementation) and 0x3F reserved
role_channels = 0x01            # repeats: the same role may be written several times (union; core §7.4)
max_clock_hz = 0x02
max_length = 0x03
min_clock_hz = 0x05
features = 0x06
channel_group = 0x08            # repeats, one per combination: group(u8) n(u8) n x (role(u8) channel(u16))
ops = 0x09                      # base(u8) bitmap (1 byte or more, base + 8 x bytes <= 256): bit i = op base + i is offered; every fn's describe carries it, fn 0 included (core §1.2, §7.4)

[usb]                           # USB identification and the shape of a probe's interfaces (transports §3)
project_vid = 0x1209            # the project's USB VID:PID: the only automatic identification of an OEP probe (transports §3)
project_pid = 0x4F45
# The interfaces inside a device known to be OEP. Neither these values nor iProduct identify an OEP probe on their own.
vendor_bulk_class = 0xFF
vendor_bulk_subclass = 0x4F     # 'O'
vendor_bulk_protocol = 0x45     # 'E'
hid_usage_page = 0xFF4F
hid_usage = 0x45

[limits]                        # values the spec text states; generated code may check them
lease_min_ms = 1000
lease_max_ms = 60000
owner_max_bytes = 32
unit_id_max_bytes = 32
slot_name_max_bytes = 32
label_max_bytes = 32            # probe.config label text: valid UTF-8 without control characters (oep-if-probe-config §1)
interface_name_max_bytes = 64
resend_max = 1                  # host: resends of one request with the same corr (core §5.2; the probing rule of transports §3)
port_speed_broken_max = 3       # probe: broken candidates in a row with no valid frame, after commit, that return a raised port to the boot speed (oep-if-link §3 return condition 4)
uart_baud_tolerance_pct = 5     # fixture uart: a realisable baud further than this percent from the requested one is refused or not used (oep-if-fixture §2, oep-if-probe-config §1)
uart_default_baud = 115200      # fixture uart: the speed before any configure or uart item, with format 0 (8N1) (oep-if-fixture §2)
max_op_ms_max = 600000          # fn 0 describe max_op_ms is 1 to this (10 minutes) (core §7.5)
restart_after_answer_ms = 100   # oep.probe.restart: the probe begins its restart at most this long after its answer has left the transport (oep-if-restart §2)

[common.enum.target_id_scheme]  # one space for the whole probe; each wire states which it uses (oep-if-debug §1)
dmi_7f = 1                      # the u32 at DMI address 0x7F of that debug module; 0 and all ones = none (not sent)
targetsel = 2                   # swd: connections entries only, the u32 TARGETSEL (0 when none)
[common.enum.read_from]         # positioned streams (oep-if-common §1.2)
position = 0
oldest = 1
now = 2
last_mark = 3
[common.enum.read_flags]        # read's flags byte (oep-if-common §1.2, oep-if-capture §3.2)
more = 0x01
gap = 0x02
[common.enum.mark_kind]         # 0x01-0x3F standard, 0x40-0x7F per interface (oep-if-common §1.3)
reset = 0x01
restart = 0x02
attach = 0x03
detach = 0x04
lost = 0x05
clear = 0x06
host = 0x07
link_lost = 0x08
closed = 0x09
[common.enum.mark_detail_reset]
ndmreset = 1                    # the reset op (oep-if-debug §4.3)
# 2 reserved: the reset op never drives a reset line (oep-if-debug §4.3)
attach_reset = 3                # the attach request's reset TLV (NRST)
[common.enum.mark_detail_restart]
havereset = 1
resync = 2                      # the console mechanism resynchronized
[common.enum.mark_detail_lost]
overflow = 1
framing = 2
parity = 3
target_timeout = 4              # dmseq: the target gave up waiting for the probe
[common.enum.mark_detail_closed]
all_released = 1
session_ended = 2               # the session's lock ended (end, lease expiry, force) and its share was the last user
slot_changed = 3
connection_closed = 4

# ---- interfaces ------------------------------------------------------------------------------------------------

[core]                          # fn 0: the core itself (oep-core); no name, not in list, its version is confirm's protocol revision
op = [
  { code = 0x01, name = "confirm", lock = false },     # answer carries boot_id (core §7.1)
  { code = 0x02, name = "list", lock = false },
  { code = 0x03, name = "describe", lock = false },
  { code = 0x04, name = "clock", lock = false },       # answer: boot_id(u32) uptime_ns(u64), the clock read while handling the request (core §7.7)
  { code = 0x10, name = "open", lock = false },
  { code = 0x11, name = "end", lock = true },
  { code = 0x12, name = "keepalive", lock = true },
  { code = 0x13, name = "lock_state", lock = false },
]
[core.tlv.confirm_answer]
transport = 0x01                # u8: the index of the transport this confirm came on (0xFF: a relaying broker); always sent (core §7.1)
[core.tlv.open]
owner = 0x01                    # text (1-32 bytes): who holds the lock, for display (core §6.4)
[core.tlv.lock_state_answer]
owner = 0x01                    # the lock holder's owner text, when its open gave one
[core.tlv.locked_payload]  # the rejected locked payload's tail, after remaining_ms(u32)
owner = 0x01
[core.tlv.unavailable_payload]   # the rejected unavailable payload (core §4.3), every fn; 0x40+ per interface
cause = 0x01                    # u8, enum unavailable_cause
channel = 0x02                  # u16; repeats
fn = 0x05                       # u16: the fn the refusal is about (a track in capture-group's bind or start)
[core.tlv.unsupported_payload]   # the rejected unsupported payload after tag(u8) (0x00 = a fixed-part value), every fn (core §4.3)
supported = 0x01                # confirm only: min(u8) max(u8), the protocol revisions the probe handles (core §7.1)
channel = 0x02                  # u16
fn = 0x05                       # u16: the fn the refusal is about (a track not in capture-group's tracks)
index = 0x40                    # u8: the position in the request's list (gpio set, wire scan)
[core.tlv.describe]             # the probe itself (fn 0); declarations only (core §7.3)
firmware = 0x40
model = 0x41
unit_id = 0x42
channels = 0x43
label = 0x46                    # repeats, one per channel: channel(u16) text: the firmware's fixed channel names (settings' labels: probe.config get)
transport = 0x49                # repeats, one per transport: index(u8) kind(u8) interface(u8, 0xFF not USB); required
chip = 0x4C                     # text: the probe MCU's part and revision (optional)
max_op_ms = 0x4D                # u32: the longest one request may take; required (core §7.5)
[core.enum.unavailable_cause]
pin_in_use = 1
limit = 2
storage_full = 3
bound_in_group = 4
held_by_settings = 5            # the settings' plan, disable, output idle or slot (core §4.3)
wrong_state = 6
[core.enum.transport_kind] # describe transport (core §7.5); 1-3 are serial ports (transports §4)
uart_bridge = 1
usb_cdc = 2
usb_serial_jtag = 3             # built-in USB serial: the MCU hardware's USB serial port, whose descriptors the probe cannot choose (core §7.5)
vendor_bulk = 4
hid = 5
tcp = 6
[core.reserved]
op = [[0x20, 0xEF]]                 # reserved (core §2.5; 0xF0-0xFF are outside every interface's op space); fn 0 sends no notifications
"tlv.describe" = [[0x3F, 0x3F], [0x44, 0x45], [0x47, 0x48], [0x4A, 0x4A], [0x4E, 0x4E]]   # 0x44 reserved, 0x45 profile, 0x47 resets_on_open, 0x4A discoverable: removed
"tlv.unavailable_payload" = [[0x03, 0x04]]   # were holder_fn, holder_kind

[[interface]]
name = "oep.probe.plan"                # which channel each role of an interface uses (oep-if-plan); listed when an interface has plan roles
revision = 1
op = [
  { code = 0x01, name = "plan_apply", lock = true },
  { code = 0x02, name = "plan_release", lock = true },  # n(u8) n x fn(u16); n = 0: every fn
]
[interface.tlv.plan_apply]
role_assignment = 0x10          # repeats; always sent critical (0x90): fn(u16) role(u8) channel(u16); one assignment is identified by all three (oep-if-plan §2.1)
[interface.tlv.describe]
plan_roles = 0x40               # u32: the most role assignments the plan holds at once, every fn together, settings' plan included (oep-if-plan §1)

[[interface]]
name = "oep.probe.restart"             # optional: the probe restarts itself (oep-if-restart)
revision = 1
op = [
  { code = 0x01, name = "restart", lock = true },       # answers, then the probe restarts as from power-on (oep-if-restart §2)
]
[interface.tlv.describe]
restart_max_ms = 0x40           # u32, required: the longest from restart's answer until the probe answers confirm again on the same transport, at least restart_after_answer_ms (oep-if-restart §1)

[[interface]]
name = "oep.probe.link"                # optional: the link test and a UART bridge's speed for a session (oep-if-link)
revision = 1
op = [
  { code = 0x01, name = "source", lock = false },     # length(u32) -> len(u16) data: byte k = k & 0xFF
  { code = 0x02, name = "sink", lock = false },       # count(u16) data -> (empty)
  { code = 0x03, name = "port_speed", lock = true },  # optional (ops): oep-if-link §3
]
[interface.enum.port_speed_step]   # port_speed's step (oep-if-link §3)
try = 0
commit = 1
revert = 2

[[interface]]
name = "oep.wire.rvswd"
revision = 1
target = "RISC-V targets whose debug module is reached over the two-wire RVSWD line"
op = [
  { code = 0x01, name = "scan", lock = true },
  { code = 0x02, name = "attach", lock = true },
  { code = 0x03, name = "detach", lock = true },
  { code = 0x05, name = "connections", lock = false },  # first(u8) -> more, count x entry
]
[interface.reserved]
op = [[0x04, 0x04]]             # was attach_under_reset
features = [[0x01, 0x01]]       # was attach_writes_unbounded
[interface.tlv.describe]
max_connections = 0x40          # u8: live connections at once (absent = 1; oep-if-debug §1)
[interface.enum.connection_users] # connections entry users bits (oep-if-debug §2.1)
host_session = 0x01
slot = 0x02
[interface.tlv.scan]
max_speed = 0x01                # u32 Hz (absent: the wire's slowest speed)
skip = 0x02                     # u16, count 0 only: pairs of the count-0 list to skip (oep-if-debug §1)
idle_clock = 0x04               # u8: SWCLK while the line rests during the scan, 0 high / 1 low
[interface.tlv.detach]
force = 0x01                    # critical, empty
[interface.tlv.attach]
max_speed = 0x01                # critical, u32 Hz; required
pins = 0x03                     # critical: swdio(u16) swclk(u16) - the pair to attach on
idle_clock = 0x04               # critical, u8: SWCLK while the line rests, 0 high / 1 low (oep-if-debug §3)
reset = 0x05                    # critical: channel(u16) hold_ms(u16) - hold the reset line, then attach (oep-if-debug §3)
[interface.tlv.attach_answer]   # the attach result's tail
target_id = 0x10                # scheme(u8) value: what the probe read of the target's identity (oep-if-debug §1)
dpc = 0x11                      # u32: the halted hart's dpc when flags halted is set
search_retries = 0x12           # u16, optional: extra attempts the bring-up needed beyond each step's first try (saturates at 0xFFFF); only when a bring-up ran (oep-if-debug §1)
[interface.enum.scan_kind]      # the kind byte of a scan entry; on rvswd only riscv-dm (oep-if-debug §3)
riscv_dm = 1
[interface.enum.attach_flags]   # the attach answer's flags, every wire
havereset_acked = 0x01
existing = 0x02
halted = 0x08                   # 0x04 reserved (swd's dormant_woken)
[interface.enum.features]       # describe features bits (common tag 0x06): none in revision 1
[interface.enum.attach_method]
run = 0
halt = 1
[interface.enum.pin_role]       # the roles of the pins in describe's channel_group / role_channels
swdio = 1
swclk = 2
reset = 3                       # a channel attach's reset TLV may take; no default (oep-if-debug §3)
[interface.enum.idle_clock]     # the idle_clock TLV and probe.config's slot field
high = 0
low = 1

[[interface]]
name = "oep.wire.swio"
revision = 1
target = "RISC-V targets whose debug module is reached over the one-wire SWIO line"
op = [
  { code = 0x01, name = "scan", lock = true },
  { code = 0x02, name = "attach", lock = true },
  { code = 0x03, name = "detach", lock = true },
  { code = 0x05, name = "connections", lock = false },
]
[interface.reserved]
op = [[0x04, 0x04]]             # was attach_under_reset
features = [[0x01, 0x01]]       # was attach_writes_unbounded
[interface.tlv.describe]
max_connections = 0x40          # u8: live connections at once (absent = 1; oep-if-debug §1)
[interface.enum.connection_users] # connections entry users bits (oep-if-debug §2.1)
host_session = 0x01
slot = 0x02
[interface.tlv.scan]
max_speed = 0x01
skip = 0x02                     # u16, count 0 only: pairs of the count-0 list to skip (oep-if-debug §1)
[interface.tlv.detach]
force = 0x01
[interface.tlv.attach]
max_speed = 0x01                # critical, required
pins = 0x03                     # critical: swdio(u16) swclk(u16, 0xFFFF: one wire) - the pair to attach on
reset = 0x05                    # critical: channel(u16) hold_ms(u16)
[interface.tlv.attach_answer]
target_id = 0x10
dpc = 0x11
search_retries = 0x12           # u16, optional (oep-if-debug §1)
[interface.enum.scan_kind]      # on swio only riscv-dm (oep-if-debug §3)
riscv_dm = 1
[interface.enum.attach_flags]
havereset_acked = 0x01
existing = 0x02
halted = 0x08                   # 0x04 reserved (swd's dormant_woken)
[interface.enum.features]       # describe features bits (common tag 0x06): none in revision 1
[interface.enum.attach_method]
run = 0
halt = 1
[interface.enum.pin_role]       # the roles of the pins in describe's channel_group / role_channels
swdio = 1
reset = 3

[[interface]]
name = "oep.wire.swd"
revision = 1
target = "ARM targets with an SWD debug port"
op = [
  { code = 0x01, name = "scan", lock = true },
  { code = 0x02, name = "attach", lock = true },
  { code = 0x03, name = "detach", lock = true },
  { code = 0x05, name = "connections", lock = false },
]
[interface.reserved]
op = [[0x04, 0x04]]             # was attach_under_reset
features = [[0x01, 0x01]]       # was attach_writes_unbounded
"tlv.attach_answer" = [[0x10, 0x11]]   # target_id and dpc are not sent on swd
[interface.tlv.describe]
max_connections = 0x40          # u8: live connections at once (absent = 1; oep-if-debug §1)
[interface.enum.connection_users] # connections entry users bits (oep-if-debug §2.1); slot is always 0 in v1
host_session = 0x01
slot = 0x02
[interface.tlv.scan]
max_speed = 0x01
skip = 0x02                     # u16, count 0 only: pairs of the count-0 list to skip (oep-if-debug §1)
targetsel = 0x06                # u32: try one multidrop target (absent: none)
[interface.tlv.detach]
force = 0x01
[interface.tlv.attach]
max_speed = 0x01                # critical, required
targetsel = 0x02                # critical, u32 (multidrop only)
pins = 0x03                     # critical: swdio(u16) swclk(u16) - the pair to attach on
reset = 0x05                    # critical: channel(u16) hold_ms(u16); probes without it refuse unsupported
[interface.tlv.attach_answer]
search_retries = 0x12           # u16, optional (oep-if-debug §1)
[interface.enum.scan_kind]
arm_adi = 2                     # 1 reserved
[interface.enum.attach_flags]
existing = 0x02                 # 0x01 and 0x08 reserved (riscv only)
dormant_woken = 0x04
[interface.enum.features]       # describe features bits (common tag 0x06): none in revision 1
[interface.enum.attach_method]
run = 0                         # halt (1) is rejected unsupported on swd
[interface.enum.pin_role]       # the roles of the pins in describe's channel_group / role_channels
swdio = 1
swclk = 2
reset = 3

[[interface]]
name = "oep.target.riscv-dm"
revision = 1
target = "RISC-V targets with a RISC-V Debug Module"
op = [
  { code = 0x01, name = "dmi", lock = true },
  { code = 0x02, name = "halt", lock = true },
  { code = 0x03, name = "resume", lock = true },
  { code = 0x04, name = "reset", lock = true },
  { code = 0x05, name = "read_block", lock = true },
  { code = 0x06, name = "write_block", lock = true },
  { code = 0x07, name = "run", lock = true },
  { code = 0x08, name = "step", lock = true },
]
[interface.tlv.describe]        # the common tags only (ops 0x09: reset, read_block / write_block, run, step are optional; no features)
[interface.tlv.step_answer]
step_left = 0x01                # length 0: step could not halt the hart again; dcsr.step may still be set and the hart runs (oep-if-debug §4.2)
[interface.enum.run_stopped]    # run answer's stopped byte (oep-if-debug §4.4)
timeout_halted = 0              # the limit passed; the probe halted the hart (dpc and values valid)
stopped = 1
not_halted = 2                  # the limit passed and the hart could not be halted (dpc invalid, nvals 0)
not_run = 3                     # the preparation (registers, dcsr, pc) failed; the hart was not run and stays halted (dpc invalid, nvals 0)
