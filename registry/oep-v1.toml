rearm = 0x08                       # rearm 1: the segment began at its own trigger

[[interface]]
name = "oep.fixture.capture-group"
family = "capture"     # oep-if-capture §4: logic / analog tracks started together (mixed signal)
revision = 1
op = [
  { code = 0x1A, name = "bind", lock = true },
  { code = 0x11, name = "start", lock = true },         # start_ns(u64) generation(u32) n(u8) n x (fn(u16) generation(u32))
  { code = 0x12, name = "stop", lock = true },
  { code = 0x13, name = "force", lock = true },  # optional: with features trigger_source (oep-if-capture §4.4)
  { code = 0x14, name = "status", lock = false },       # state(u8) start_ns(u64) generation(u32)
  { code = 0x01, name = "subscribe", lock = true },      # optional (ops); core §10.3
  { code = 0x02, name = "unsubscribe", lock = true },    # optional (ops), with subscribe
]
[interface.tlv.bind]            # behavioral selectors are sent critical
trigger_source = 0x01           # stages(u8) holdoff_ns(u64) arm(u8) rearm(u8): the trigger expression (oep-if-capture §4.4)
stage = 0x02                    # stage(u8) count(u32) within_ns(u64) on_timeout(u8)
cond = 0x03                     # stage(u8) part(u8: 0 term, 1 abort) term(u8) src(u8: 1 track, 2 external) fn(u16) role(u8) type(u8) args
trigger_out = 0x04              # role(u8) width_ns(u32) polarity(u8)
[interface.tlv.describe]        # plus required ops 0x07 and features 0x05
tracks = 0x40                   # n(u8) n x fn(u16): the tracks it can bind
trigger_caps = 0x41             # max_stages(u8) max_terms(u8) max_conds(u8) cross_track(u8) types(u32) protocols(u8) trigger_out_latency_ns(u32)
[interface.tlv.status_answer]
trigger = 0x02                  # fn(u16) ns(u64) uncertainty_ns(u32), once the event happened (oep-if-capture §4.4)
[interface.event]               # numbered as the tracks' events; the group's generation (start answer, status) in each
stopped = 0x02                  # reason(u8) error(u8) generation(u32): as the track's stopped
triggered = 0x03                # trigger_fn(u16) trigger_ns(u64) trigger_uncertainty_ns(u32) generation(u32) (oep-if-capture §4.4)
[interface.enum.features]       # bits; others are OEP's to allocate (subscribe and unsubscribe are declared by ops)
trigger_source = 0x01           # oep-if-capture §4.4
