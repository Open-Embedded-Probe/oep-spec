[[interface]]
name = "oep.probe.config"
revision = 1
op = [
  { code = 0x10, name = "get", lock = false },
  { code = 0x11, name = "set", lock = true },
  { code = 0x12, name = "save", lock = true },
  { code = 0x13, name = "erase", lock = true },
  { code = 0x14, name = "unset", lock = true },
  { code = 0x15, name = "state", lock = false },
]
[interface.tlv.item]            # the items of the configuration (get / set / unset); every item repeats, one per key (the same key twice is malformed, oep-if-probe-config §2); unused tags are unallocated
plan = 0x01                     # fn(u16) role(u8) channel(u16); key (fn, role, channel)
label = 0x02                    # channel(u16) text
idle = 0x03                     # channel(u16) mode(u8) drive(u8, gpio's drive_level): the state of a free pin (4 bytes)
slot = 0x04                     # a place a target is wired to (oep-if-probe-config §1.1)
uart = 0x06                     # fn(u16) baud(u32) format(u8): a fixture UART settings preset; host explicitly configures it
disable = 0x07                  # channel(u16): a channel the probe never uses or touches (not on this board)
wifi = 0x08                     # index(u8) ssid_len(u8) ssid pass_len(u8) passphrase; key index; the passphrase is write-only (oep-if-probe-config §1.4)
[interface.tlv.describe]        # declarations only; the state is op 0x15 (oep-if-probe-config §3)
storage = 0x40                  # max_bytes(u32, 1 or more): the item TLV bytes it can always save; present exactly when ops offers save and erase
items = 0x41                    # u8 list: the item tags this probe takes
slots_max = 0x42                # u8
wifi_max = 0x46                 # u8, 1 or more: wifi entries (index 0 .. wifi_max - 1); present exactly when items has wifi
[interface.tlv.state_answer]    # the state answer's TLV tail (oep-if-probe-config §3)
wifi = 0x01                     # state(u8) entry(u8) reason(u8) rssi(i8) ipv4(4 bytes); on every page when items has wifi

[interface.line_names]          # standard line names of label texts (oep-if-probe-config §1.3); private names start with x-
nrst = "the target's reset line (the host)"
power_hi = "a line that powers the target when high (the host only)"
power_lo = "a line that powers the target when low (the host only)"
[interface.enum.idle_mode]
hi_z = 0
pull_up = 1
pull_down = 2
output_low = 3
output_high = 4




[interface.enum.storage_state]
none = 0
applied = 1
unreadable = 2
[interface.enum.storage_unreadable]   # state's unreadable_reason: why the saved items were not applied (§3)
form = 1                        # not readable (damaged, another firmware's form)
interface = 2                   # an interface they name is gone or of another revision,
refused = 3                     # applying them was refused (resources clash)
[interface.enum.wifi_pass_len]  # the wifi item's pass_len besides 8-64 (oep-if-probe-config §1.4)
none = 0                        # no passphrase (an open network)
hidden = 0xFF                   # get: the entry has a passphrase, none follows; set: keep the entry's current passphrase
[interface.enum.wifi_state]     # the state answer's wifi TLV
off = 0                         # no wifi entries: Wi-Fi not used
connecting = 1
connected = 2
waiting = 3                     # every entry failed; the probe waits, then tries again
[interface.enum.wifi_entry]
none = 0xFF                     # the state answer's entry when no entry is being tried or used
[interface.enum.wifi_reason]    # the last failure; 0 after a connection
none = 0
not_found = 1
auth = 2
no_address = 3
other = 4
