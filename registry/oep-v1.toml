# OEP v1 registry: every number on the wire, in one place (v1, before the freeze: values may still change until then).
# The spec text is docs/oep-core.ja.md and docs/oep-transports.ja.md (the core) and interfaces/*.ja.md (the interfaces whose names begin with oep.). tools/oepgen1.py generates
# the C++ header, the C header and the Python and JS modules from this file; `oepgen1.py --check` fails when the committed outputs drift.
# Numbers only: payload layouts stay in the spec tables. TLV tags live in the context of one (interface, op) or one
# declaration or notification; response reason and event kind may also define distinct contexts (core §2.2).
# Per op: `lock` = needs the session lock, not whether the op is mandatory. Listing an op here does not require its implementation;
# required/optional adoption is defined by the interface operation table, and each endpoint declares its offered ops in describe.
# Shared enums live under [common.enum.*]; USB descriptor constants under [usb];
# text and value limits under [limits]. After the freeze keys are never renamed, only added (versioning §5);
# the hash tells only whether generated code matches this file, nothing about wire compatibility.
# The hash embedded in the generated files is the sha256 of this file with line endings normalized to LF.
# Per interface: `retired.<enum or "op">` = ranges [[lo, hi]] no value may use; `status` / `reject_reasons` = the
# interface's own values (0x40-0x7F). Common describe tags ([describe_common]) are not repeated in an interface.
# TLV tags are written as their number, the low 7 bits (core §2.2); a request sets bit 7 itself when it sends one critical.
# Before freeze, removed numbers may be reused. After freeze, removed allocations are retired and never reused.
# A tag appears once unless its comment says `repeats`; a reader that meets a non-repeating tag twice uses the first (core §2.3).
#
# Table kinds. The registry uses these and no others; a generator written from this list reads the whole file.
#   [registry]         schema = integer (the layout of this file; 1).
#   [protocol]         name = string, revision = integer, byte_order = string ("little").
#   [constants]        name = integer (u8 unless the comment says otherwise) or string (the 4-byte ASCII confirm magics).
#   [roles] [resolutions] [outcomes] [reject_reasons] [status]
#                      name = integer: a u8 wire value of the core.
#   [timing] [limits]  name = integer: a time (suffix _ms), a size (_bytes), a speed (_baud), or a count; the spec states it.
#   [describe_common]  name = integer: a describe TLV tag (u8, low 7 bits) every interface may use.
#   [usb]              name = integer: a USB descriptor value (the project's VID / PID u16, class / subclass / protocol u8,
#                      HID usage page / usage u16).
#   [common.enum.<enum>]  name = integer: one value space shared by every interface (u8 unless the enum's comment says otherwise).
#   [core]             the core's own numbers (fn 0; the core has no name and is not in list, core §0): the keys and sub-tables of
#                      [[interface]] below except name, revision, fn, target and family.
#   [[interface]]      one per interface, with these keys and sub-tables only:
#     name = string, revision = integer, fn = integer (u16; only where the fn is fixed: none in v1),
#     target = string (optional: the target family the interface is for, core §12 rule 8; absent = any family),
#     op = array of inline tables { code = integer (u8), name = string, lock = bool };
#     [interface.tlv.<context>]   name = integer: a TLV tag (u8, low 7 bits) in that op, answer, payload or declaration;
#     [interface.enum.<enum>]     name = integer: a value of a field, or a bit mask for a bit set (the width is the field's);
#     [interface.event]           name = integer: an event kind (u8, 0x01-0x7F);
#     [interface.status] [interface.reject_reasons]   name = integer: the interface's own values (0x40-0x7F; none yet);
#     [interface.retired]        key = "op", an enum name, or "tlv.<context>"; value = array of [lo, hi] integer ranges;
#     [interface.line_names]      name = string: a standard name and its description (1-32 of a-z 0-9 _ -, no x- prefix).
#     [interface.names.<list>]    name = string: a standard name of a named list (core §7.7) and its description.
#     [interface.settings]        "item name" = string: a settings item the interface (or the core) owns (core §13): its name
#                                 (`{}` = the key) and "form, key_kind[, flags]; meaning". An enum item's form names its choices:
#                                 `enum <name>` is the enum of that name in the same unit, its keys read with `-` for `_`
#                                 (hi_z = "hi-z"); `enum (<source>)` is a list the probe declares.
# A new table kind, or a new key of [[interface]] or of an op, is a registry change made by a pull request (CONTRIBUTING.md).

[registry]
schema = 1

[protocol]
name = "oep"
revision = 1
byte_order = "little"

[constants]
confirm_request_magic = "OEP?"
confirm_result_magic = "OEP!"
tag_critical = 0x80             # bit 7 of a TLV tag in a request: a probe that does not implement the tag refuses (core §2.3)
tag_reserved_zero = 0x00        # never a TLV tag; the rejected unsupported payload's "fixed-part value" marker (core §4.3)
tag_named_extension = 0x7F      # the named extension TLV in every context: name_len(u8) name data (core §2.2); no definition uses it otherwise
min_max_frame = 64              # every probe takes messages this long; a host sends no longer message before confirm answers (transports §3)
op_subscribe = 0x01             # common-operation range in every interface's op space: subscribe of the interface that sends notifications (core §10.3)
op_unsubscribe = 0x02           # common-operation range in every interface's op space: unsubscribe (core §10.3)

[roles]
request = 0x01
result = 0x02
event = 0x03
data = 0x04

[resolutions]
rejected = 0x00
completed = 0x01

[outcomes]                      # the detail byte of a completed result
success = 0x00
failed = 0x01
partial = 0x02

[reject_reasons]                # 0x01-0x3F core, 0x40-0x7F per interface, 0x80-0xFF unallocated
unknown_function = 0x01
unknown_operation = 0x02
malformed = 0x03
unavailable = 0x04
window_exceeded = 0x06
no_session = 0x07               # a request with a session_id while no session holds the lock: open a new session (core §6.2, §9)
locked = 0x08
session_required = 0x09
no_resource = 0x0A
unsupported = 0x0B
result_lost = 0x0C              # a resend whose answer is not kept (it fell out of the table, or was too large): read the state again (core §5.1)

[status]                        # wire and target operations (oep-if-common §3); 0x06-0x3F unallocated, 0x40-0x7F per interface
ok = 0
wait = 1
line = 2
fault = 3
timeout = 4
state = 5

[timing]                        # times and line values host and probe both implement (transports §2, §4, §5; core §10)
probe_frame_gap_ms = 200        # no sender pauses this long inside a frame, and a probe's reader restarts after such a pause (not on TCP; transports §2); a host waits longer than this before a resync's confirm (transports §5)
uart_bridge_boot_baud = 115200  # a UART bridge's boot speed, 8N1 without flow control (transports §4)
port_speed_idle_ms = 3000       # a committed port_speed goes back to the boot speed after this long without a good frame (oep-if-link §3)
host_wait_add_ms = 1000         # host: waits at least max_op_ms (or an explicitly shorter whole-request bound) plus this plus transfer time; discovery before max_op_ms also includes core_quick_op_max_ms (core §4.4)
core_quick_op_max_ms = 1000     # whole processing bound for fn 0 confirm/list/describe/clock/keepalive/lock_state: min(this, max_op_ms), excluding transport and preceding requests on the same or other routes (core §4.4)
notify_pending_max_frames = 2   # probe: at most max_frame x this of notifications waiting in one transport's send buffer; beyond it they are dropped (core §10.4)
port_speed_switch_wait_ms = 20  # host: after the answer to try, at least this long before the next request at the new speed (oep-if-link §3 host 1)

[describe_common]               # declaration tags every interface's describe may use (core §7.4); unused values are unallocated
role_channels = 0x01            # repeats: the same role may be written several times (union; core §7.4)
max_clock_hz = 0x02
max_length = 0x03               # per-function limit; also apply the route's max_frame. Unpaged external RX interfaces bound this to every route's frame (core §7.4)
min_clock_hz = 0x04
features = 0x05
channel_group = 0x06            # repeats, one per combination: group(u8) n(u8) n x (role(u8) channel(u16))
ops = 0x07                      # base(u8) bitmap (1 byte or more, base + 8 x bytes <= 256): bit i = op base + i is offered; every fn's describe carries it, fn 0 included (core §1.2, §7.4)
setting = 0x08                  # repeats, one per settings item the fn owns: form(u8) key_kind(u8) keys(u16) max_len(u8) flags(u8) name(text); the k-th is item number k (core §13.2)
setting_choice = 0x09           # repeats, one per choice of an enum item: number(u8) value(u8) name(text, 1-16 of a-z 0-9 -) (core §13.2)

[usb]                           # USB identification and the shape of a probe's interfaces (transports §3)
project_vid = 0x1209            # the project's USB VID:PID: the only automatic identification of an OEP probe (transports §3)
project_pid = 0x4F45
# The interfaces inside a device known to be OEP. Neither these values nor iProduct identify an OEP probe on their own.
vendor_bulk_class = 0xFF
vendor_bulk_subclass = 0x4F     # 'O'
vendor_bulk_protocol = 0x45     # 'E'
hid_usage_page = 0xFF4F
hid_usage = 0x45

[limits]                        # values the spec text states; generated code may check them
request_header_bytes = 10
result_header_bytes = 5
corr_max = 0xFFFF
corr_half_range = 0x8000       # modulo-65536 forward distance must be smaller than this (core §4.1, §5.1)
resource_id_bytes = 4         # u32 resource references; fn and corr remain u16 (core §9)
resource_id_max = 0xFFFFFFFF  # boot-scoped nonreuse; zero is not a resource ID (core §9)
lease_min_ms = 1000             # owner processing pauses lease; response generation renews it, transport waits/replay/observers do not (core §6.1)
lease_max_ms = 60000
owner_max_bytes = 32
unit_id_max_bytes = 32
wifi_ssid_max_bytes = 32        # core setting wifi.{}.ssid (transports §7.1)
wifi_min_max_frame = 82         # max_frame floor for a probe with the network settings: a get answer 18 + the 64-byte key (transports §7)
label_max_bytes = 32            # core setting channel.{}.label text, unique in a probe ignoring ASCII case (core §13.8)
setting_name_max_bytes = 48     # a settings item name, `{}` included; describe setting is 6 + this = 54 bytes (core §13.2)
setting_choice_name_max_bytes = 16  # setting_choice name, 1-16 of a-z 0-9 - (core §13.2)
channel_name_max_bytes = 16     # describe channel_name, 1-16 of A-Z a-z 0-9 _ - (core §7.5)
setting_get_overhead_bytes = 18 # one value's get answer is this + len; max_len <= the smallest max_frame - this (core §13.2, §13.5)
interface_name_max_bytes = 48   # a list answer with one entry is 5 + 3 + 6 + 48 = 62 bytes, within min_max_frame (core §7.2, §12)
port_speed_tolerance_pct = 2    # port_speed: the nearest speed the UART can make may differ from the request by at most this percent (oep-if-link §3)
uart_baud_tolerance_pct = 5     # fixture uart: a realisable baud further than this percent from the requested one is refused (oep-if-fixture §2)
max_op_ms_max = 600000          # fn 0 describe max_op_ms is 1 to this (10 minutes) (core §7.5)

[common.enum.target_id_scheme]  # one space for the whole probe; each wire states which it uses (oep-if-debug §1)
dmi_7f = 1                      # the u32 at DMI address 0x7F of that debug module; 0 and all ones = none (not sent)
dpidr = 2                       # swd: the u32 DPIDR read during attach; never a Host selector
[common.enum.read_from]         # positioned streams (oep-if-common §1.2)
position = 0
oldest = 1
now = 2
last_mark = 3
[common.enum.read_flags]        # read's flags byte (oep-if-common §1.2, oep-if-capture §3.2)
more = 0x01
gap = 0x02
[common.enum.mark_kind]         # 0x01-0x3F standard, 0x40-0x7F per interface (oep-if-common §1.3)
lost = 0x01
clear = 0x02
host = 0x03
[common.enum.mark_detail_lost]
overflow = 1
framing = 2
parity = 3

# ---- interfaces ------------------------------------------------------------------------------------------------

[core]                          # fn 0: the core itself (oep-core); no name, not in list, its version is confirm's protocol revision
op = [
  { code = 0x01, name = "confirm", lock = false },     # answer carries boot_id (core §7.1)
  { code = 0x02, name = "list", lock = false },
  { code = 0x03, name = "describe", lock = false },    # answer: more(u8) TLVs; each TLV with the header 5 and more 1 fits every transport's max_frame; past the end: more 0, no TLVs (core §7.3)
  { code = 0x04, name = "clock", lock = false },       # answer: boot_id(u32) uptime_ns(u64), the clock read while handling the request (core §7.6)
  { code = 0x10, name = "open", lock = false },
  { code = 0x11, name = "end", lock = true },
  { code = 0x12, name = "keepalive", lock = true },
  { code = 0x13, name = "lock_state", lock = false },
  { code = 0x20, name = "get", lock = false },         # settings (core §13.5); required with settings
  { code = 0x21, name = "set", lock = true },          # required, with unset, for a probe that lets values change
  { code = 0x22, name = "unset", lock = true },
  { code = 0x23, name = "save", lock = true },         # optional, with state (core §13.7)
  { code = 0x24, name = "state", lock = false },       # required with save
  { code = 0x25, name = "network", lock = false },     # required with describe netif (transports §7.3)
]
[core.tlv.confirm_answer]
transport = 0x01                # u8: index of this endpoint's describe transport entry; always sent (core §7.1)
[core.tlv.open]
owner = 0x01                    # text (1-32 bytes): who holds the lock, for display (core §6.4)
[core.tlv.lock_state_answer]
owner = 0x01                    # the lock holder's owner text, when its open gave one
[core.tlv.locked_payload]  # the rejected locked payload's tail, after remaining_ms(u32)
owner = 0x01
[core.tlv.unavailable_payload]   # the rejected unavailable payload (core §4.3), every fn; 0x40+ per interface
cause = 0x01                    # u8, enum unavailable_cause
channel = 0x02                  # u16; repeats
item = 0x03                     # u8: the place (from 0) of the refused value in a settings set / unset (core §13.5)
fn = 0x05                       # u16: the fn the refusal is about; usable by every interface
[core.tlv.unsupported_payload]   # the rejected unsupported payload after tag(u8) (0x00 = a fixed-part value), every fn (core §4.3)
supported = 0x01                # confirm only: min(u8) max(u8), the protocol revisions the probe handles (core §7.1)
channel = 0x02                  # u16
item = 0x03                     # u8: the place (from 0) of the refused value in a settings set / unset (core §13.5)
fn = 0x05                       # u16: the fn the refusal is about; usable by every interface
[core.tlv.describe]             # the probe itself (fn 0); declarations only (core §7.3)
firmware = 0x40                 # optional text diagnostic/version information (core §7.5)
model = 0x41
unit_id = 0x42
channels = 0x43                 # u16; channel numbers are 0 .. channels - 1; required when the probe has channels, absent = none (core §7.5)
channel_name = 0x44             # repeats, one per channel: channel(u16) text: the datasheet pin name; required with channels (core §7.5)
netif = 0x45                    # repeats, one per network interface: its name (text); a named list (core §7.7, transports §7)
transport = 0x49                # repeats, one per transport: index(u8) kind(u8) interface(u8, 0xFF not USB); required
chip = 0x4C                     # text: the probe MCU's part and revision (optional)
max_op_ms = 0x4D                # u32, required: validation, internal retries, execution, cleanup and response generation for one request;
                               # excludes transfer and waits for preceding requests on the same or other routes (core §4.4, §7.5)
[core.enum.unavailable_cause]   # 0x01-0x3F core; 0x40-0x7F interface of the request fn; 0x80+ unallocated (core §2.5, §4.3)
pin_in_use = 1
limit = 2                      # count, resource or processing-capacity limit (core §4.3, §8.1)
storage_full = 3
bound_in_group = 4
held_by_settings = 5            # the settings' disable or output idle (core §4.3)
wrong_state = 6
policy_denied = 7              # optional admission policy before replay/session; five public discovery ops exempt (core §4.3)
[core.enum.transport_kind] # describe transport (core §7.5); 1-3 are serial ports (transports §4)
uart_bridge = 1
usb_cdc = 2
usb_serial_jtag = 3             # built-in USB serial: the MCU hardware's USB serial port, whose descriptors the probe cannot choose (core §7.5)
vendor_bulk = 4
hid = 5
tcp = 6
[core.enum.route_kind]          # the short names of transport kinds in a route name: kind + ordinal, `cdc0` (core §13.3)
bridge = 1
cdc = 2
usj = 3
bulk = 4
hid = 5
tcp = 6
[core.enum.setting_form]        # describe setting form (core §13.3)
bytes = 1
text = 2
u32 = 3
ipv4 = 4
bool = 5
enum = 6
channel = 7
transport = 8
fn = 9
[core.enum.setting_key_kind]    # describe setting key_kind (core §13.3)
none = 0
channel = 1
index = 2
transport = 3
netif = 4
[core.enum.setting_flag]
secret = 0x01                   # write-only: get returns len 0; set len 0 keeps the value (core §13.5)
restart = 0x02                  # the new value takes effect after a restart (core §13.2)
[core.enum.storage_state]       # state (core §13.7)
none = 0
applied = 1
unreadable = 2
partial = 3
[core.enum.storage_reason]
none = 0
form = 1
item = 2
capacity = 3
[core.enum.channel_idle]        # core setting channel.{}.idle (core §13.8)
hi_z = 0
pull_up = 1
pull_down = 2
low = 3
high = 4
[core.enum.ipv4_mode]           # core setting ipv4.{}.mode (transports §7.2)
dhcp = 0
static = 1
[core.enum.network_state]       # network (transports §7.3)
off = 0
connecting = 1
up = 2
waiting = 3
[core.enum.network_reason]
none = 0
not_found = 1
auth = 2
no_address = 3
other = 4
[core.names.netif]              # the standard network interfaces (transports §7); others are reverse-DNS names
wifi = "Wi-Fi station"
ethernet = "wired Ethernet"
[core.line_names]               # Host conventions only (host-development-guide §5.3): roles named by channel.{}.label
swdio = "the debug data line (2 wires: rvswd, swd) (Host only)"
swclk = "the debug clock line (2 wires: rvswd, swd) (Host only)"
swio = "the one debug wire (swio) (Host only)"
rx = "the fixture UART receive, wired to the target TX (Host only)"
tx = "the fixture UART transmit, wired to the target RX (Host only)"
nrst = "the target reset line (Host only)"
power_hi = "target power on when high (Host only)"
power_lo = "target power on when low (Host only)"
[core.settings]                 # the core's items (core §13.8, transports §7)
"channel.{}.label" = "text 1-32, channel; the pin's label (NRST)"
"channel.{}.idle" = "enum channel_idle, channel; the idle state (core §8)"
"channel.{}.disable" = "bool, channel; true: the probe neither drives nor configures the pin"
"wifi.{}.ssid" = "text 1-32, index (entry); the network's name"
"wifi.{}.passphrase" = "text 8-64, index (entry), secret; 8-63 printable passphrase or 64 hex digits"
"ipv4.{}.mode" = "enum ipv4_mode, netif; dhcp when absent"
"ipv4.{}.address" = "ipv4, netif; static address"
"ipv4.{}.prefix" = "u32 1-32, netif; static prefix length"
"ipv4.{}.gateway" = "ipv4, netif; static gateway, none when absent"
"ipv4.{}.dns" = "ipv4, netif; static DNS server, none when absent"

[[interface]]
name = "oep.probe.plan"                # which channel each role of an interface uses (oep-if-plan); listed when an interface has plan roles
revision = 1
op = [
  { code = 0x10, name = "plan_apply", lock = true },
  { code = 0x11, name = "plan_release", lock = true },  # n(u8) n x fn(u16); n = 0: every fn
]
[interface.tlv.plan_apply]
role_assignment = 0x10          # repeats: fn(u16) role(u8) channel(u16); one assignment is identified by all three (oep-if-plan §2.1)
[interface.tlv.describe]
plan_roles = 0x40               # u32: the most runtime role assignments the plan holds at once, every fn together (oep-if-plan §1)

[[interface]]
name = "oep.probe.restart"             # optional: the probe restarts itself (oep-if-restart)
revision = 1
op = [
  { code = 0x10, name = "restart", lock = true },       # answers, then the probe restarts as from power-on (oep-if-restart §2)
]
[interface.tlv.describe]
restart_max_ms = 0x40           # u32, required: Probe-controlled internal restart readiness; excludes OS enumeration/network availability (restart §1)

[[interface]]
name = "oep.probe.link"                # optional: the link test and a UART bridge's speed for a session (oep-if-link)
revision = 1
op = [
  { code = 0x10, name = "source", lock = false },     # length(u32) -> len(u16) data: byte k = k & 0xFF
  { code = 0x11, name = "sink", lock = false },       # count(u16) data -> (empty)
  { code = 0x12, name = "port_speed", lock = true },  # optional (ops): oep-if-link §3
  { code = 0x13, name = "port_state", lock = false }, # required with port_speed; current route baud(u32), state(u8)
]
[interface.enum.port_speed_step]   # port_speed's step (oep-if-link §3)
try = 0
commit = 1
revert = 2
[interface.enum.port_state]
boot = 0
trying = 1
committed = 2
recovery_pending = 3

[[interface]]
name = "oep.wire.rvswd"
family = "wire"
revision = 1
target = "RISC-V targets whose debug module is reached over the two-wire RVSWD line"
op = [
  { code = 0x10, name = "scan", lock = true },  # optional (ops); debug §3
  { code = 0x11, name = "attach", lock = true },
  { code = 0x12, name = "detach", lock = true },
  { code = 0x13, name = "connections", lock = false },  # first(u8) -> more, count x entry
  { code = 0x14, name = "holds", lock = false },  # first(u8) -> more, count x (swdio, swclk, rest): ports held after close (debug §2.2)
]

[interface.tlv.describe]
max_connections = 0x40          # u8: live connections at once (absent = 1; oep-if-debug §1)

[interface.tlv.scan]
max_speed = 0x01                # u32 Hz (absent: the wire's slowest speed)
idle_clock = 0x03               # u8: SWCLK while the line rests during the scan, 0 high / 1 low

[interface.tlv.attach]          # fixed body: method(u8), swdio(u16), swclk(u16), max_speed(u32)
idle_clock = 0x03               # critical, u8: SWCLK while the line rests, 0 high / 1 low; absent: from target_id (oep-if-debug §3.1)
reset = 0x04                    # critical: channel(u16) hold_ms(u16) - hold the reset line, then attach (oep-if-debug §3)
[interface.tlv.attach_answer]   # the attach result's tail
target_id = 0x01                # scheme(u8) value: what the probe read of the target's identity (oep-if-debug §1)
dpc = 0x02                      # optional u32 RV32 dpc, only when flags halted is set
idle_clock = 0x03               # u8, always: the rest the connection uses, 0 high / 1 low (oep-if-debug §3.1)
[interface.tlv.connections_answer]
idle_clock = 0x02               # every entry: entry_index(u8) idle_clock(u8) (oep-if-debug §2.1, §3.1)
[interface.enum.scan_kind]      # the kind byte of a scan entry; on rvswd only riscv-dm (oep-if-debug §3)
riscv_dm = 1
[interface.enum.attach_flags]   # the attach answer's flags, every wire
havereset_acked = 0x01
halted = 0x08                   # 0x04 is meaningful only on SWD (dormant_woken)
[interface.enum.features]       # describe features bits (common tag 0x05)
attach_halt = 0x01              # optional attach method 1; method 0 is mandatory
[interface.enum.attach_method]
run = 0
halt = 1
[interface.enum.pin_role]       # the roles of the pins in describe's channel_group / role_channels
swdio = 1
swclk = 2
reset = 3                       # a channel attach's reset TLV may take; no default (oep-if-debug §3)
[interface.enum.idle_clock]     # the RVSWD idle_clock TLV
high = 0
low = 1
[interface.enum.target_id_family] # target_id scheme 1 (DMI 0x7F) >> shift = the chip family (oep-if-debug §3.1)
shift = 20
[interface.enum.idle_low_family] # families whose debug module needs SWCLK low at rest; an attach without idle_clock rests them low (oep-if-debug §3.1)
ch32l103 = 0x103


[interface.tlv.unavailable_payload] # scan candidate diagnostic; interface-owned tag
