# OEP v1 registry: every number on the wire, in one place (2026-09-25, working toward the freeze).
# The spec text is docs/oep-core.ja.md (the core) and docs/oep-if-*.ja.md (the standard interfaces). tools/oepgen1.py generates
# the C++ header and the Python module from this file; `oepgen1.py --check` fails when the committed outputs drift.
# Numbers only: payload layouts stay in the spec tables. TLV tags live in the context of one (interface, op) or one
# declaration; the same value in another context is another tag (core §2.2).
# Per op: `lock` = needs the session lock; `closed_tail = true` = the response ends with a list of unknown length
# (read bytes), so nothing can be appended after it (core §2.3). The key `fields` is reserved on ops for payload
# layouts later (encoders / decoders generated from here).
# The hash embedded in the generated files is the sha256 of this file with line endings normalized to LF.
# Per interface: `reserved.<enum or "op">` = ranges [[lo, hi]] no value may use; `status` / `reject_reasons` = the
# interface's own values (0x40-0x7F). Common describe tags ([describe_common]) are not repeated in an interface.

[registry]
schema = 1

[protocol]
name = "oep"
revision = 1
byte_order = "little"

[constants]
confirm_request_magic = "OEP?"
confirm_result_magic = "OEP!"
role_session_flag = 0x80        # bit 7 of a request's role: a session id follows the header
tag_critical = 0x80             # bit 7 of a TLV tag in a request: the probe must honour it or refuse
tag_ignored = 0x7F              # in every context: a response TLV listing the non-critical tags the probe ignored
tag_invalid = 0xFF
min_max_frame = 64              # every probe takes messages this long; a host sends no longer message before confirm answers (core §3.3)

[roles]
request = 0x01
result = 0x02
event = 0x05
data = 0x06

[resolutions]
rejected = 0x00
completed = 0x01
accepted = 0x02                 # reserved: v1 has no long operations (core §10); a host treats it as a failure

[outcomes]                      # the detail byte of a completed result
success = 0x00
failed = 0x01
partial = 0x02

[reject_reasons]                # 0x01-0x3F core, 0x40-0x7F per interface, 0x80-0xFF reserved
unknown_function = 0x01
unknown_operation = 0x02
malformed = 0x03
unavailable = 0x04
busy = 0x05                     # reserved with the long operations (core §10)
window_exceeded = 0x06
no_session = 0x07
locked = 0x08
session_required = 0x09
no_connection = 0x0A
unsupported = 0x0B
result_lost = 0x0C              # a request sent again whose result was too large to keep (read it again)
corr_reused = 0x0D              # a request sent again with the same corr but another fn, op or payload

[status]                        # wire and target operations (oep-if-common §3); 0x06-0x3F reserved, 0x40-0x7F per interface
ok = 0
wait = 1
line = 2
fault = 3
timeout = 4
state = 5

[timing]                        # values host and probe both implement (core §3.2, §5.1, §11)
resync_quiet_ms = 50            # host: read and discard until the input is this quiet, then confirm
probe_frame_gap_ms = 200        # probe: a pause this long inside a frame restarts its reader
host_frame_pause_max_ms = 100   # host: never pause inside one frame longer than this
heartbeat_default_ms = 1000     # fn 0 subscription with max_delay_ms 0

[describe_common]               # declaration tags every interface's describe may use (core §7.4)
role_channels = 0x01
max_clock_hz = 0x02
max_length = 0x03
min_clock_hz = 0x05
features = 0x06
implementation = 0x07
channel_group = 0x08

# ---- interfaces ------------------------------------------------------------------------------------------------

[[interface]]
name = "oep.core"
fn = 0
revision = 1
op = [
  { code = 0x01, name = "confirm", lock = false },
  { code = 0x02, name = "list", lock = false },
  { code = 0x03, name = "describe", lock = false },
  { code = 0x04, name = "plan_apply", lock = true },
  { code = 0x05, name = "plan_release", lock = true },
  { code = 0x10, name = "open", lock = false },
  { code = 0x11, name = "end", lock = true },
  { code = 0x12, name = "keepalive", lock = true },
  { code = 0x13, name = "lock_state", lock = false },
  { code = 0x30, name = "subscribe", lock = true },
  { code = 0x32, name = "unsubscribe", lock = true },
  { code = 0x40, name = "link_source", lock = false, closed_tail = true },
  { code = 0x41, name = "link_sink", lock = false },
]
[interface.tlv.plan_apply]
role_assignment = 0x90          # critical: fn(u16) role(u8) channel(u16)
[interface.tlv.open]
owner = 0x01                    # text (1-32 bytes): who holds the lock, for display (core §6.4)
[interface.tlv.lock_state_answer]
owner = 0x01                    # the lock holder's owner text, when its open gave one
[interface.tlv.locked_payload]  # the rejected locked payload's tail, after remaining_ms(u32)
owner = 0x01
[interface.tlv.describe]        # the probe itself (fn 0)
firmware = 0x40
model = 0x41
unit_id = 0x42
channels = 0x43
reserved = 0x44
profile = 0x45
label = 0x46
resets_on_open = 0x47
transport = 0x49                # index(u8) kind(u8) interface(u8, 0xFF not USB): one per transport; required
oep_pid = 0x4A                  # u8: 1 = the probe also enumerates with the OEP VID:PID
plan_roles = 0x4B               # u16: the most role assignments the plan holds at once, every fn together (core §8)
chip = 0x4C                     # text: the probe MCU's part and revision (optional)
[interface.enum.transport_kind] # describe transport (core §7.5); 1-3 are serial ports (core §3.4)
uart_bridge = 1
usb_cdc = 2
usb_serial_jtag = 3
vendor_bulk = 4
hid = 5
tcp = 6
[interface.event]
heartbeat = 0x01                # boot_id(u32), uptime_ms(u32)
[interface.reserved]
op = [[0x20, 0x2F]]             # the long operations (core §10)

[[interface]]
name = "oep.wire.rvswd"
revision = 1
op = [
  { code = 0x01, name = "scan", lock = true },
  { code = 0x02, name = "attach", lock = true },
  { code = 0x03, name = "detach", lock = true },
  { code = 0x04, name = "attach_under_reset", lock = true },
  { code = 0x05, name = "connections", lock = false },
]
[interface.tlv.describe]
max_connections = 0x40          # u8: live connections at once (absent = 1; oep-if-debug §1)
[interface.enum.connection_users] # connections entry users bits (oep-if-debug §2.1)
host_session = 0x01
slot = 0x02
[interface.tlv.scan]
skip = 0x01                     # u16, count 0 only: pairs of the count-0 list to skip (oep-if-debug §1)
[interface.tlv.detach]
force = 0x01
[interface.tlv.attach]
max_speed = 0x01
pins = 0x03                     # critical: swdio(u16) swclk(u16, 0xFFFF on one wire) - the pair to attach on
idle_clock = 0x04               # critical, u8: SWCLK while the line rests, 0 high / 1 low (oep-if-debug §3)
[interface.tlv.attach_under_reset]
max_speed = 0x01
pins = 0x03
idle_clock = 0x04               # critical, u8: SWCLK while the line rests, 0 high / 1 low (oep-if-debug §3)
[interface.tlv.attach_answer]   # the attach / attach_under_reset result's tail
target_id = 0x10                # scheme(u8) value: what the probe read of the target's identity (oep-if-debug §1)
[interface.enum.target_id_scheme]
wch_dmi_7f = 1                  # the u32 at DMI 0x7F of a WCH debug module; 0 and all ones = none (not sent)
[interface.enum.attach_method]
run = 0
halt = 1
[interface.enum.pin_role]       # the roles of the pins in describe's channel_group / role_channels
swdio = 1
swclk = 2
reset = 3                       # a channel attach_under_reset may take; no default (oep-if-debug §3)
[interface.enum.idle_clock]     # the idle_clock TLV and probe.config's slot field
high = 0
low = 1

