[[interface]]
name = "oep.fixture.logic"
revision = 1
op = [
  { code = 0x10, name = "configure", lock = true },
  { code = 0x11, name = "start", lock = true },
  { code = 0x12, name = "stop", lock = true },
  { code = 0x13, name = "force", lock = true },
  { code = 0x14, name = "status", lock = false },
  { code = 0x15, name = "read", lock = false },
  { code = 0x16, name = "segments", lock = false },
  { code = 0x17, name = "release", lock = true },
  { code = 0x18, name = "query", lock = false },
  { code = 0x01, name = "subscribe", lock = true },      # optional (ops); core §11.3
  { code = 0x02, name = "unsubscribe", lock = true },    # optional (ops), with subscribe
]
[interface.tlv.configure]       # also the request of query (the analog-only tag 0x47 frontend is not used here); mode and rate required (oep-if-capture §3.3)
mode = 0x40
rate = 0x42
samples = 0x43
segments = 0x44
trigger = 0x45                  # type(u8) role(u8) value(u32)
pretrigger = 0x46
multirate = 0x60                # repeats, one per role: role(u8) policy(u8, enum multirate_policy) d(u32) param(u32); the host sets the critical bit (0xE0) (oep-if-capture §5.2)
[interface.tlv.configure_answer]  # the answer of configure and query
actual_rate = 0x50
layout = 0x51                   # w(u8, 1-128, any integer) C(u8) pos[C](u8)
actual_samples = 0x52
actual_segments = 0x53
blocking_ms = 0x56
block = 0x60                    # L(u32): base samples per block; multirate only, with the layout of the D = 1 channels (oep-if-capture §5.3)
[interface.tlv.status_answer]
error = 0x01                    # u8, enum error: why state is 6
[interface.tlv.data]            # the data frame's TLV tail (core §11.2)
generation = 0x01               # u32, required in streaming mode
[interface.tlv.describe]        # plus the common tags (ops 0x07, features 0x05, enum features)
mode = 0x40                     # repeats, one per mode: mode(u8) max_samples(u32) max_segments(u32): the maximum (not the current free space)
rate_range = 0x41
channels = 0x44                 # max(u8)
trigger = 0x45                  # types(u32 bit set) max_pretrigger(u32)
multirate = 0x60                # policies(u32 bit set of multirate_policy) min_d(u32) max_d(u32) pow2(u8) (oep-if-capture §5.1)
[interface.event]               # every event carries its generation (oep-if-capture §3.4)
segment = 0x01                  # the segment record (oep-if-capture §2)
stopped = 0x02                  # reason(u8) error(u8) generation(u32)
triggered = 0x03                # serial(u32) trigger_index(u32) trigger_ns(u64) generation(u32)
[interface.enum.features]       # none in revision 1; unused values are unallocated (query, force, subscribe and unsubscribe are declared by ops)

[interface.enum.mode]
one_shot = 1
repeat = 2
streaming = 3
[interface.enum.trigger]
immediate = 0
level = 1
edge = 2
[interface.enum.state]
unconfigured = 0
configured = 1
waiting = 2
capturing = 3
done = 4
paused = 5
error = 6
[interface.enum.stopped_reason]
complete = 0
host = 1
no_free_segment = 2             # reserved: not sent (the probe resumes on release; oep-if-capture §3.2)
error = 3
[interface.enum.error]          # status_answer error / stopped's error byte; 0x40 onwards probe-specific (oep-if-capture §3.2)
peripheral = 1
storage = 2
clock = 3
[interface.enum.status_flag]    # status flags, reset on start
dropped = 0x01
slipped = 0x02
[interface.enum.multirate_policy] # the multirate TLV's policy (oep-if-capture §5.4); 3 onwards reserved
sample = 0                      # 1 bit: x(k*D + phase); D = 1 is a D = 1 channel
any_active = 1                  # 1 bit: active if any base sample of the interval is active
edge_latch = 2                  # 2 bits: bit0 the interval's last level, bit1 a change to active from the previous base sample
[interface.enum.segment_flag]      # segment flags (oep-if-capture §2)
gap = 0x01
short = 0x02
slipped = 0x04                     # the time base bent inside the segment (a sample taken one sample period or more late)

