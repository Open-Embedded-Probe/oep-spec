[interface.enum.storage_state]
none = 0
applied = 1
unreadable = 2
[interface.enum.storage_unreadable]   # state's unreadable_reason: why the saved items were not applied (§3.3)
form = 1                        # not readable (damaged, another firmware's form)
interface = 2                   # an interface they name is gone or of another revision, or a bind's port is not a serial port
