[[interface]]
name = "oep.fixture.capture"
revision = 1
op = [
  { code = 0x01, name = "configure", lock = true },
  { code = 0x02, name = "start", lock = true },
  { code = 0x03, name = "stop", lock = true },
  { code = 0x04, name = "force", lock = true },
  { code = 0x05, name = "status", lock = false },
  { code = 0x06, name = "read", lock = false, closed_tail = true },
  { code = 0x07, name = "segments", lock = false },
  { code = 0x08, name = "release", lock = true },
  { code = 0x09, name = "query", lock = false },
]
[interface.tlv.configure]       # also the request of query
mode = 0x40
rate = 0x42
samples = 0x43
segments = 0x44
trigger = 0x45
pretrigger = 0x46
frontend = 0x47
[interface.tlv.configure_answer]  # the answer of configure and query
actual_rate = 0x50
layout = 0x51
actual_samples = 0x52
actual_segments = 0x53
timing = 0x54
scale = 0x55
blocking_ms = 0x56
[interface.tlv.describe]        # plus the common tags (features 0x06: bit0 query, bit1 force, bit2 notifications)
