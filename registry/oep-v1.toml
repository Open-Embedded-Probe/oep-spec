[[interface]]
name = "oep.probe.config"
revision = 1
op = [
  { code = 0x01, name = "get", lock = false },
  { code = 0x02, name = "set", lock = true },
  { code = 0x03, name = "save", lock = true },
  { code = 0x04, name = "erase", lock = true },
  { code = 0x05, name = "unset", lock = true },
  { code = 0x06, name = "state", lock = false },
]
[interface.tlv.item]            # the items of the configuration (get / set / unset); 0x7E reserved for response meta
plan = 0x01                     # fn(u16) role(u8) channel(u16); key (fn, role, channel)
label = 0x02                    # channel(u16) text
idle = 0x03                     # channel(u16) mode(u8) [drive_kind(u8) drive_value(u16)]: the state of a free pin
slot = 0x04                     # a place a target is wired to (oep-if-probe-config §1.1)
bind = 0x05                     # what a serial port carries (oep-if-probe-config §1.2)
uart = 0x06                     # fn(u16) baud(u32) format(u8): a fixture UART's settings, applied when its plan is set
disable = 0x07                  # channel(u16): a channel the probe never uses or touches (not on this board)
[interface.tlv.describe]        # declarations only; the state is op 0x06 (oep-if-probe-config §3.3)
storage = 0x40                  # max_bytes(u32): canonical bytes it can save (0 = no storage)
items = 0x41                    # u8 list: the item tags this probe takes
slots_max = 0x42                # u8
bind_modes = 0x43               # u32 bits of bind_mode; last_reset and manual always
[interface.reserved]
"tlv.describe" = [[0x44, 0x45]] # were slot_state / bind_state (moved to op state)
"tlv.item" = [[0x7E, 0x7E]]
[interface.line_names]          # standard line names of label texts (oep-if-probe-config §1.3); private names start with x-
nrst = "the target's reset line (the probe's retry with reset, and the host)"
power_hi = "a line that powers the target when high (the host only)"
power_lo = "a line that powers the target when low (the host only)"
